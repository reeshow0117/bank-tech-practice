{id:'E02',area:'epi',topic:'资料分析',level:'基础',q:'某系统日均处理量由800万笔升至1000万笔，增长率是多少？',o:['20%','25%','28%','30%'],a:[1],x:'增长率=(1000−800)/800=25%。分母应为原值。'},

{id:'E15',area:'epi',topic:'资料分析',level:'基础',q:'甲团队完成240项需求，缺陷12项；乙团队完成400项需求，缺陷16项。哪支团队的缺陷率更低？',o:['甲，低1个百分点','乙，低1个百分点','两者相同','信息不足'],a:[1],x:'甲为12/240=5%，乙为16/400=4%，乙低1个百分点。'},
{id:'E16',area:'epi',topic:'数量关系',level:'进阶',q:'某任务原计划10天完成。前4天每天完成总量的8%，此后每天完成总量的12%。从开工起至少需要多少天完成？',o:['9','10','11','12'],a:[1],x:'前4天完成32%，剩余68%；每天12%，还需向上取整(68/12)=6天，总计10天。'},
{id:'E17',area:'epi',topic:'常识应用',level:'基础',q:'某银行计划上线新的手机银行功能。若想减少大规模故障影响，以下哪种发布方式更合理？',o:['不测试直接全量上线','先小范围灰度验证，再逐步扩大','出问题后再补备份','只检查页面颜色'],a:[1],x:'先在小范围验证功能和监控指标，再分阶段扩大流量，可以较早发现异常并控制影响范围；灰度也不能替代上线前测试。'},
{id:'E18',area:'epi',topic:'逻辑推理',level:'基础',q:'三人甲、乙、丙轮值，甲不在周一，乙在周三，丙不在周二。周一由谁值班？',o:['甲','乙','丙','无法确定'],a:[2],x:'乙已在周三，甲不在周一，所以周一只能是丙。'},
{id:'E19',area:'epi',topic:'资料分析',level:'基础',q:'某系统成功请求9800次、失败请求200次。请求成功率为多少？',o:['96%','97%','98%','99%'],a:[2],x:'成功率=9800/(9800+200)=98%。'},
{id:'E20',area:'epi',topic:'数量关系',level:'进阶',q:'从1至20共20个整数中随机选1个，它是2的倍数或3的倍数的概率是多少？',o:['1/2','3/5','13/20','7/10'],a:[2],x:'2的倍数10个、3的倍数6个、同时是6的倍数3个；并集13个，概率13/20。'},
{id:'E21',area:'epi',topic:'数量关系',level:'进阶',q:'甲从A地到B地走了180千米，用时3小时；沿原路返回又用时2小时。往返全程的平均速度是多少千米/小时？',o:['60','72','75','90'],a:[1],x:'往返距离为360千米，总用时5小时；平均速度=360÷5=72千米/小时，不能直接平均两段速度。'},
{id:'E22',area:'epi',topic:'数字规律',level:'基础',q:'数列 1，4，10，19，31，（ ）下一项是多少？',o:['43','45','46','48'],a:[2],x:'相邻两项依次相差3、6、9、12，每次增加3；下一差为15，所以31+15=46。'},
{id:'E23',area:'epi',topic:'资料分析',level:'基础',q:'某团队前三个月分别完成120、150、180项任务。第二个月的完成量占三个月总量的多少？',o:['1/4','1/3','2/5','1/2'],a:[1],x:'总量为120+150+180=450项，第二个月占150÷450=1/3。'},
{id:'E24',area:'epi',topic:'逻辑推理',level:'进阶',q:'凡按期提交的材料均通过了格式检查；材料甲没有通过格式检查。据此一定能推出什么？',o:['材料甲没有按期提交','材料甲的内容一定有误','材料甲从未提交','所有未按期提交的材料都未通过检查'],a:[0],x:'按期提交→通过格式检查；材料甲未通过，否定后件可推出其未按期提交，其余结论无依据。'},
{id:'E25',area:'epi',topic:'言语理解',level:'基础',q:'“单看某条日志可能难以判断故障原因；把日志与调用链和时间线对照，才能更准确地定位问题。”这段话主要强调什么？',o:['日志记录没有价值','应结合多种线索定位故障','故障都由调用链引起','只看时间线就足够了'],a:[1],x:'转折后的核心是将日志、调用链与时间线结合分析，而不是否定单条日志的价值。'},
{id:'E26',area:'epi',topic:'排列组合',level:'进阶',q:'甲、乙等5名不同员工排成一列合影，要求甲与乙相邻，有多少种不同排法？',o:['24','36','48','60'],a:[2],x:'把甲乙视为一个整体，与其余3人共4个单位，有4!种顺序；甲乙内部有2种顺序，共4!×2=48种。'},
{id:'E27',area:'epi',topic:'常识应用',level:'基础',q:'同一时刻，某会议系统显示协调世界时 UTC 为06:00。若另一处使用 UTC+8 的时间，该处应显示几点？',o:['前一天22:00','当日06:00','当日14:00','当日18:00'],a:[2],x:'UTC+8的当地钟点比UTC快8小时；06:00加8小时为当日14:00。'},
{id:'E28',area:'epi',topic:'数量关系',level:'进阶',q:'某月处理1200笔业务，次月比该月增长25%。下列说法哪些正确？（多选）',o:['增加了300笔','次月处理1500笔','增加量占次月处理量的25%','次月处理量是该月的125%'],a:[0,1,3],x:'增量=1200×25%=300笔，次月为1500笔、是原来的125%；300÷1500=20%，不是25%。'},
{id:'E29',area:'epi',topic:'资料分析',level:'进阶',q:'甲渠道交易量由80万笔增至120万笔，乙渠道由200万笔增至220万笔。关于增长量，下列哪项正确？',o:['甲比乙多增长20万笔','乙比甲多增长20万笔','两者增长量相同','甲比乙多增长40万笔'],a:[0],x:'甲增长120−80=40万笔，乙增长220−200=20万笔；甲的增长量多20万笔。'},
{id:'E30',area:'epi',topic:'逻辑推理',level:'进阶',q:'规定“凡完成培训者都通过测验”。已知甲完成培训、乙未通过测验。下列哪些结论一定成立？（多选）',o:['甲通过测验','乙完成培训','乙未完成培训','甲未完成培训'],a:[0,2],x:'完成培训→通过测验，所以甲通过；乙未通过是否定后件，可推出乙未完成。另两项与已知条件相反。'},
{id:'E31',area:'epi',topic:'言语理解',level:'基础',q:'按照“先弄清问题，再提出并检验对策”的思路，以下哪种表述顺序最合理？',o:['识别风险→评估影响→制定措施→验证效果','验证效果→识别风险→制定措施→评估影响','制定措施→验证效果→识别风险→评估影响','评估影响→制定措施→验证效果→识别风险'],a:[0],x:'先识别风险并评估其影响，再制定措施，最后验证措施是否有效；其余顺序把验证或措施放在问题识别之前。'},
{id:'E32',area:'epi',topic:'数字规律',level:'进阶',q:'数列 2，5，4，10，6，15，（ ）下一项是多少？',o:['8','18','20','21'],a:[0],x:'奇数位置依次是2、4、6、8；偶数位置依次是5、10、15，故第七项为8。'},
{id:'E33',area:'epi',topic:'排列组合',level:'进阶',q:'4名开发人员、3名测试人员各不相同。选3人组成小组，恰有2名开发人员和1名测试人员，共有多少种选法？',o:['12','15','18','24'],a:[2],x:'从4名开发中选2名有C(4,2)=6种，从3名测试中选1名有3种；共6×3=18种。'},
{id:'E34',area:'epi',topic:'资料分析',level:'基础',q:'某日甲、乙、丙三个柜台分别办理80、120、100笔业务。乙柜台的业务量占三者总量的比例是多少？',o:['30%','35%','40%','45%'],a:[2],x:'总量80+120+100=300笔；乙柜台占120÷300=40%。'},
{id:'E35',area:'epi',topic:'逻辑推理',level:'基础',q:'甲、乙、丙分别在周一至周三各值班一天。已知甲早于乙值班，乙早于丙值班。周二值班的是谁？',o:['甲','乙','丙','无法确定'],a:[1],x:'三人各值一天且先后顺序必须为甲→乙→丙，因此乙在周二。'},
{id:'E36',area:'epi',topic:'言语理解',level:'进阶',q:'“新功能先向少量用户开放，观察异常后再逐步扩大范围。这样即使出现问题，也能及时停止扩展，减少影响。”这段话意在说明什么？',o:['新功能不需要监测','分阶段发布有助于控制影响范围','发布速度越慢越好','少量用户不会遇到问题'],a:[1],x:'文段说明先小范围开放、监测并渐进扩大，是为了在出现异常时限制影响；并未断言不会出问题。'},
{id:'E37',area:'epi',topic:'数量关系',level:'进阶',q:'甲单独完成一项任务需6小时，乙单独完成需3小时。若两人效率恒定且同时开始，合作完成需多少小时？',o:['1.5','2','2.5','3'],a:[1],x:'两人每小时分别完成1/6与1/3，总效率为1/2项/小时；完成一项需2小时。'},
{id:'E38',area:'epi',topic:'资料分析',level:'进阶',q:'甲渠道上期80万笔、本期100万笔；乙渠道上期120万笔、本期150万笔。下列哪些说法正确？（多选）',o:['甲渠道增长25%','乙渠道增长25%','两渠道合计增长25%','甲渠道在合计中的占比上升'],a:[0,1,2],x:'甲增幅20/80=25%，乙增幅30/120=25%；合计由200增至250，增幅25%。甲占比两期均为40%，没有上升。'},
{id:'E39',area:'epi',topic:'数量关系',level:'基础',q:'从1到30的整数中，所有3的倍数之和是多少？',o:['135','150','165','180'],a:[2],x:'3的倍数为3、6、…、30，共10个；其和=3×(1+2+…+10)=3×55=165。'},
{id:'E40',area:'epi',topic:'数量关系',level:'基础',q:'某设备每隔4分钟完成一笔任务。从第1笔完成到第7笔完成，共经过多少分钟？',o:['20','24','28','32'],a:[1],x:'第1笔完成到第7笔完成之间只有6个间隔，经过6×4=24分钟。'},
{id:'E41',area:'epi',topic:'数字规律',level:'基础',q:'数列 1，2，6，24，120，（ ）下一项是多少？',o:['600','720','840','960'],a:[1],x:'各项依次是1!、2!、3!、4!、5!，下一项为6!=720。'},
{id:'E42',area:'epi',topic:'言语理解',level:'进阶',q:'填入句中两处空白最恰当的一组词是：“先梳理问题边界，___制定修复方案；___问题仍未解决，还需回到证据核查。”',o:['再；若','只要；就','因为；所以','既然；那么'],a:[0],x:'“先……再……”表示先后顺序；“若……还需……”表示假设条件。其余组合与原句语义或衔接不符。'},
{id:'E43',area:'epi',topic:'逻辑推理',level:'进阶',q:'所有已接入测试环境的终端都完成了登记。下列哪些结论一定成立？（多选）',o:['已接入的终端已登记','未登记的终端未接入','已登记的终端都已接入','已接入的终端都未登记'],a:[0,1],x:'已接入→已登记，可由否定后件推出未登记→未接入；已登记不能反推已接入。'},
{id:'E44',area:'epi',topic:'资料分析',level:'进阶',q:'某日100笔小额订单每笔20元，另有300笔大额订单每笔40元。全部订单的平均金额是多少元？',o:['30','32','35','38'],a:[2],x:'总金额100×20+300×40=14000元，共400笔；平均金额为14000÷400=35元。'},
{id:'E45',area:'epi',topic:'排列组合',level:'基础',q:'甲、乙两名不同员工分别从5个编号不同的空工位中选1个，且不能选同一工位。有多少种安排？',o:['10','15','20','25'],a:[2],x:'甲有5种选择，乙须选剩余4个工位之一；按人区分，安排数为5×4=20。'},
{id:'E46',area:'epi',topic:'数量关系',level:'进阶',q:'一件商品先按原价打九折，再在折后价基础上打八折。最终价格比原价降低了百分之几？',o:['20%','25%','28%','30%'],a:[2],x:'最终价为原价的90%×80%=72%，故比原价降低1−72%=28%。'},
{id:'E47',area:'epi',topic:'常识应用',level:'基础',q:'下载文件后，将其摘要值与可信来源事先提供的摘要值比对，两者一致主要用于检查什么？',o:['文件传输中是否发生变化','文件是否对所有人保密','服务器是否永远可用','文件是否已经被阅读'],a:[0],x:'可信摘要一致主要用于检查文件完整性；不等于保证保密性、持续可用性或阅读状态。'},
{id:'E48',area:'epi',topic:'逻辑推理',level:'进阶',q:'已知“有些甲类记录是乙类记录”“所有乙类记录都是丙类记录”。一定能推出下列哪项？',o:['所有甲类记录都是丙类记录','有些甲类记录是丙类记录','所有丙类记录都是甲类记录','没有甲类记录属于丙类记录'],a:[1],x:'存在至少一条同时属于甲类和乙类的记录；乙类全部属于丙类，因此该记录也属于丙类。'},
{id:'E49',area:'epi',topic:'言语理解',level:'进阶',q:'“某试点在非高峰时段进行，平均等待时间由10分钟降至8分钟；尚未收集高峰时段数据。”下列哪些说法有依据？（多选）',o:['试点时段平均等待时间减少2分钟','试点时段平均等待时间降幅为20%','高峰时段也一定缩短2分钟','现有信息不足以判断高峰时段效果'],a:[0,1,3],x:'10−8=2分钟，相对原来的10分钟下降20%；试点未覆盖高峰，不能推断高峰改善幅度。'},
{id:'E50',area:'epi',topic:'资料分析',level:'进阶',q:'甲组处理1000笔、失败10笔；乙组处理100笔、失败5笔。两组合计失败率约为多少？',o:['1.00%','1.36%','1.50%','5.00%'],a:[1],x:'失败总数15笔、处理总数1100笔；15÷1100≈1.36%，不能直接平均两组失败率。'},
{id:'E51',area:'epi',topic:'数量关系',level:'基础',q:'某采购清单中两种配件数量分别为x、y，且3x+2y=40。若x=8，则y是多少？',o:['6','8','10','12'],a:[1],x:'代入x=8，有24+2y=40，因此2y=16，y=8。'},
{id:'E52',area:'epi',topic:'数字规律',level:'进阶',q:'数列 2，3，5，8，12，17，（ ）下一项是多少？',o:['21','22','23','24'],a:[2],x:'相邻两项的差依次为1、2、3、4、5，下一差为6；17+6=23。'},
{id:'E53',area:'epi',topic:'排列组合',level:'进阶',q:'6份互不相同的报告中选3份，指定的甲、乙两份不能同时入选。有多少种选法？',o:['12','14','16','18'],a:[2],x:'不受限时有C(6,3)=20种；甲乙都入选时再从其余4份中选1份，有4种；符合条件的有20−4=16种。'},
{id:'E54',area:'epi',topic:'资料分析',level:'进阶',q:'某业务连续四周处理量依次为80、100、100、120件。下列哪些说法正确？（多选）',o:['四周合计400件','四周合计420件','周均处理量100件','第四周比第三周增长20%'],a:[0,2,3],x:'合计80+100+100+120=400件，周均400÷4=100件；第四周较第三周多20件，增幅20/100=20%。'},
{id:'E55',area:'epi',topic:'逻辑推理',level:'进阶',q:'排班规定：如果甲当班，那么乙也当班。已知乙没有当班，以下哪项一定成立？',o:['甲没有当班','甲一定当班','乙当班但甲不当班','无法判断甲是否当班'],a:[0],x:'甲当班→乙当班；乙未当班是否定后件，可推出甲未当班。'},
{id:'E56',area:'epi',topic:'言语理解',level:'进阶',q:'“只有记录完整，才能复现问题。”若该句成立，下列哪项一定正确？',o:['记录完整就一定能复现问题','能够复现问题则记录完整','不能复现问题则记录不完整','记录不完整仍能复现问题'],a:[1],x:'“只有A，才B”表示B→A；能复现是B，因此必然记录完整。记录完整只是必要条件，不保证复现。'},
{id:'E57',area:'epi',topic:'数量关系',level:'进阶',q:'40名员工中，22人参加甲培训，25人参加乙培训，10人两项都未参加。两项培训都参加的有多少人？',o:['12','15','17','20'],a:[2],x:'至少参加一项的有40−10=30人；由容斥原理，两项都参加=22+25−30=17人。'},
{id:'E58',area:'epi',topic:'常识应用',level:'进阶',q:'准备公开演示测试账户时，哪些做法有助于避免暴露真实个人信息？（多选）',o:['使用虚构测试数据代替真实身份信息','遮盖截图中可能识别个人的标识','直接展示未经处理的真实账户号','仅向有工作需要的人员提供原始数据'],a:[0,1,3],x:'虚构数据与遮盖标识能减少公开暴露，原始数据按需提供可控制访问范围；展示真实账户号会增加泄露风险。'},
{id:'E59',area:'epi',topic:'数量关系',level:'进阶',q:'从1到100的整数中，是4的倍数但不是6的倍数的数有多少个？',o:['16','17','18','25'],a:[1],x:'4的倍数有⌊100/4⌋=25个；同时为4和6的倍数即12的倍数有⌊100/12⌋=8个；相减得17个。'},
{id:'E60',area:'epi',topic:'资料分析',level:'进阶',q:'甲部门上季度完成80项、本季度完成100项；乙部门上季度完成120项、本季度完成130项。两部门合计完成量的季度增幅是多少？',o:['10%','15%','20%','25%'],a:[1],x:'上季度合计80+120=200项，本季度合计100+130=230项；增幅=(230−200)/200=15%。'},
{id:'E61',area:'epi',topic:'数量关系',level:'进阶',q:'某网点备用金中有50元和100元纸币共16张，面额合计1100元。100元纸币有多少张？',o:['4张','6张','8张','10张'],a:[1],x:'设100元纸币有y张，则50(16−y)+100y=1100，解得y=6张。'},
{id:'E62',area:'epi',topic:'资料分析',level:'进阶',q:'某业务上月共2400笔，其中手机渠道900笔；本月共3000笔，其中手机渠道1500笔。手机渠道占比上升了多少个百分点？',o:['10个百分点','12.5个百分点','15个百分点','20个百分点'],a:[1],x:'上月占比900÷2400=37.5%，本月占比1500÷3000=50%；上升50%−37.5%=12.5个百分点。'},
{id:'E63',area:'epi',topic:'言语理解',level:'基础',q:'“页面显示申请已提交，只说明系统收到请求；是否最终入账，还需查询处理结果。”下列哪项最符合原意？',o:['申请一提交就一定入账','提交提示与最终入账是不同状态','未出现提交提示就一定已入账','处理结果只能在线下查询'],a:[1],x:'前半句限定提交提示仅代表收到请求，后半句要求另查处理结果，故不能把提交等同于入账。'},
{id:'E64',area:'epi',topic:'排列组合',level:'进阶',q:'用数字1、2、3、4组成两位服务编号，数字不重复且十位必须为偶数。下列哪些说法正确？（多选）',o:['共有6个符合条件的编号','其中大于30的有3个','其中个位为偶数的有2个','其中含数字1的有4个'],a:[0,1,2],x:'十位可取2或4，个位各有3种，共2×3=6个；十位为4的3个均大于30；个位为偶数的仅24、42两个；含1的仅21、41两个。'},
{id:'E65',area:'epi',topic:'逻辑推理',level:'基础',q:'一次对账告警已查明恰由“网络延迟”和“字段校验失败”中的一种引发，且两者不会同时发生。现已排除网络延迟，能确定什么？',o:['字段校验失败引发了告警','两种原因同时发生','两种原因都未发生','告警并未出现'],a:[0],x:'题干规定两种原因恰有一种成立；既然网络延迟被排除，剩余唯一原因是字段校验失败。'},
{id:'E66',area:'epi',topic:'资料分析',level:'基础',q:'某日5笔柜面业务的办理时长分别为3、5、5、8、19分钟。办理时长的中位数是多少分钟？',o:['5','6','8','19'],a:[0],x:'5个数已经从小到大排列，中位数是第(5+1)÷2=3个数，即5分钟；不受最大值19分钟影响。'},
{id:'E67',area:'epi',topic:'资料分析',level:'进阶',q:'甲渠道上月600笔、本月660笔；乙渠道上月400笔、本月540笔。本月乙渠道占两渠道总量的多少？',o:['40%','42%','45%','50%'],a:[2],x:'本月两渠道合计660+540=1200笔，乙占540÷1200=45%。'},
{id:'E68',area:'epi',topic:'数量关系',level:'进阶',q:'三项独立检查分别每6、8、12分钟完成一次。9:00三项刚好同时完成，下一次同时完成是在几点？',o:['9:18','9:20','9:24','9:36'],a:[2],x:'相邻两次同时完成的间隔为6、8、12的最小公倍数24分钟，因此下一次为9:24。'},
{id:'E69',area:'epi',topic:'判断推理',level:'进阶',q:'从甲、乙、丙、丁四份材料中恰选2份送审，要求丙必选且甲、乙不能同时入选。下列哪些组合符合要求？（多选）',o:['甲、丙','乙、丙','丙、丁','甲、乙'],a:[0,1,2],x:'丙占一席，另一席可从甲、乙、丁中任选，共甲丙、乙丙、丙丁3组；甲乙组合不含丙且甲乙同选。'},
{id:'E70',area:'epi',topic:'言语理解',level:'基础',q:'一份业务中断简报要求先写已证实的影响，再标注尚待核实的范围，最后说明下次更新时间。以下哪份摘要符合要求？',o:['已确认部分柜台受影响；其他范围待核实；17:00更新','其他范围待核实；17:00更新；已确认部分柜台受影响','17:00更新；已确认部分柜台受影响；其他范围待核实','已确认部分柜台受影响；17:00更新；其他范围待核实'],a:[0],x:'规定顺序为“已证实影响→待核实范围→下次更新时间”，只有第一项的三段排列完全一致。'},
{id:'E71',area:'epi',topic:'图形规律',level:'基础',q:'一幅3×3文字图阵依次为：第一行“圆、方、三角”，第二行“方、三角、圆”，第三行“三角、圆、空格”。若每行都恰含这三种图形各一个，空格应填什么？',o:['圆','方','三角','无法确定'],a:[1],x:'第三行已有三角和圆，按每行三种图形各一个的规则，缺少且只缺少方。'},
{id:'E72',area:'epi',topic:'数字规律',level:'进阶',q:'某监测图的两组交错刻度组成数列：5，11，10，21，20，41，（ ）。下一项是多少？',o:['31','40','42','81'],a:[1],x:'奇数位置依次为5、10、20、40，每次翻倍；偶数位置为11、21、41，按前项×2−1递推，所以第七项为40。'},
{id:'E73',area:'epi',topic:'组合数学',level:'进阶',q:'6个不同网点中选2个作为试点，再从剩余网点中指定1个作为备选。试点两网点不区分先后，共有多少种安排？',o:['30','45','60','90'],a:[2],x:'试点选法C(6,2)=15种；每种试点选定后备选有4种，合计15×4=60种。'},
{id:'E74',area:'epi',topic:'资料分析',level:'进阶',q:'某日开始时有待处理申请180笔，当日新增70笔、办结90笔，无其他增减。下列哪些说法正确？（多选）',o:['日末待处理160笔','待处理量比日初减少20笔','办结量比新增量多20笔','日末待处理量比日初减少50笔'],a:[0,1,2],x:'日末待处理=180+70−90=160笔，较日初少20笔；办结90−新增70=20笔。'},
{id:'E75',area:'epi',topic:'言语理解',level:'进阶',q:'“精简开户表单可以减少重复录入，但删去字段前，必须确认必要的身份核验仍能完成。”这段话强调什么？',o:['所有字段都应该删除','精简字段要以不影响必要核验为前提','重复录入有助于提高核验速度','身份核验只需依赖表单长度'],a:[1],x:'“但”之后提出限制条件：删字段前须确认身份核验仍可完成；并非无条件删减。'},
{id:'E76',area:'epi',topic:'判断推理',level:'基础',q:'已知“有些自动告警并非真实故障”。下列哪项一定成立？',o:['所有自动告警都是真实故障','至少有一个自动告警不是真实故障','所有真实故障都会触发自动告警','没有自动告警能对应真实故障'],a:[1],x:'“有些……并非……”是存在命题，表示至少有一个自动告警不是真实故障；不能推及其余所有情形。'},
{id:'E77',area:'epi',topic:'数量关系',level:'基础',q:'某批模拟业务每笔收取2元处理费，共12笔；整批另收固定服务费6元。总费用是多少元？',o:['24','26','30','36'],a:[2],x:'逐笔费用为12×2=24元，另加整批固定费用6元，总计24+6=30元。'},
{id:'E78',area:'epi',topic:'资料分析',level:'进阶',q:'甲渠道办理量由80笔增至100笔，乙渠道由40笔增至60笔。乙的增幅比甲高多少个百分点？',o:['15个百分点','20个百分点','25个百分点','50个百分点'],a:[2],x:'甲增幅(100−80)÷80=25%，乙增幅(60−40)÷40=50%；相差50%−25%=25个百分点。'},
{id:'E79',area:'epi',topic:'组合数学',level:'基础',q:'用0、1、2三个数字各用一次生成三位模拟凭证号，首位不能为0。下列哪些凭证号符合规则？（多选）',o:['102','120','201','012'],a:[0,1,2],x:'102、120、201均各用0、1、2一次且首位非0；012以0开头，不是符合条件的三位数。'},
{id:'E80',area:'epi',topic:'图形规律',level:'基础',q:'某图形序列的圆点数依次为第1幅1个、第2幅3个、第3幅6个、第4幅10个；相邻新增圆点数依次为2、3、4个。按此规律，第5幅有多少个圆点？',o:['13','14','15','16'],a:[2],x:'每幅比前一幅依次多2、3、4个，下一次多5个；第5幅为10+5=15个。'},
{id:'E81',area:'epi',topic:'数量关系',level:'基础',q:'某网点需将300份不同业务回执装箱，每箱最多装64份。若只考虑装下所有回执，至少需要多少箱？',o:['4箱','5箱','6箱','7箱'],a:[1],x:'4箱最多装4×64=256份，不够；5箱容量320份，可装下300份，所以至少5箱。'},
{id:'E82',area:'epi',topic:'数字规律',level:'基础',q:'依次记录的设备剩余配额为81，27，9，3，（ ）。若每次变为前一次的三分之一，下一项是多少？',o:['0','1','2','3'],a:[1],x:'每项都是前一项的三分之一：81→27→9→3，因此下一项为3÷3=1；选B。'},
{id:'E83',area:'epi',topic:'逻辑推理',level:'进阶',q:'某类记录归档前必须完成审核，且只有已归档的记录才能生成汇总报告。记录甲已生成汇总报告，一定可以推出什么？',o:['甲已归档且完成审核','甲完成审核但一定未归档','甲尚未完成审核','所有审核完成的记录都有报告'],a:[0],x:'有报告→已归档；已归档→已完成审核。串联两条必要条件，甲既已归档也已完成审核。'},
{id:'E84',area:'epi',topic:'资料分析',level:'进阶',q:'周一处理2000笔业务、失败20笔；周二处理4000笔业务、失败20笔。下列哪些说法正确？（多选）',o:['周一失败率为1%','周二失败率为0.5%','两天失败笔数相同','两天合计失败率为0.75%'],a:[0,1,2],x:'周一20÷2000=1%，周二20÷4000=0.5%，失败数均为20；合计40÷6000≈0.667%，不是0.75%。'},
{id:'E85',area:'epi',topic:'言语理解',level:'进阶',q:'某网点换用新排队页面后，预约到店人数增加；同期还开展了宣传活动。现有信息最能支持哪种判断？',o:['人数增加一定只由新页面造成','人数增加一定只由宣传活动造成','不能仅凭同期变化判定新页面的独立效果','人数增加说明排队时间必然缩短'],a:[2],x:'新页面与宣传活动同期发生，缺少排除宣传影响的证据；人数变化不足以单独识别页面效果。'},
{id:'E86',area:'epi',topic:'数量关系',level:'基础',q:'某客户两笔模拟缴费的金额合计260元，较大一笔比另一笔多40元。较大一笔是多少元？',o:['110','130','150','170'],a:[2],x:'设较大一笔为L，则较小一笔为260−L；由L−(260−L)=40，得2L=300，L=150元。'},
{id:'E87',area:'epi',topic:'组合数学',level:'进阶',q:'6种不同颜色的业务提示卡中选3种展示，已知红色卡和蓝色卡恰好选其中1种。共有多少种选法？',o:['8','10','12','16'],a:[2],x:'红、蓝二选一有2种；其余2张从另外4种颜色中选，有C(4,2)=6种；合计2×6=12种。'},
{id:'E88',area:'epi',topic:'图形规律',level:'基础',q:'提示图案按“▲○○，▲▲○○○，▲▲▲○○○○”依次变化。若每幅比前一幅多1个三角和1个圆，下一个图案是什么？',o:['▲▲▲▲○○○○○','▲▲▲▲○○○○','▲▲▲○○○○○','▲▲▲▲▲○○○○'],a:[0],x:'前三幅分别有1个三角2个圆、2个三角3个圆、3个三角4个圆；下一幅应有4个三角5个圆。'},
{id:'E89',area:'epi',topic:'判断推理',level:'进阶',q:'在一项模拟转账流程中，当且仅当身份核验通过且余额充足时，申请才标为“可执行”。下列哪些说法正确？（多选）',o:['未通过身份核验时不可执行','可执行的申请必定余额充足','身份核验通过就一定可执行','身份核验通过且余额充足时可执行'],a:[0,1,3],x:'可执行⇔身份核验通过且余额充足；缺任一条件均不可执行，而仅通过核验不能保证余额充足。'},
{id:'E90',area:'epi',topic:'数量关系',level:'进阶',q:'将1至50号业务凭证依次编号，其中编号除以7余3的凭证共有多少张？',o:['6张','7张','8张','9张'],a:[1],x:'满足条件的编号为3、10、17、24、31、38、45，共7张；下一张52已超过50。'},
{id:'E91',area:'epi',topic:'言语理解',level:'进阶',q:'某业务系统先将申请按业务类型分流，再在每一类中按提交顺序处理。下列哪项符合该规则？',o:['所有申请必须合并为一个队列排序','同类型申请内部仍按提交先后处理','不同类型申请必须交叉按时间排序','分流后不再考虑提交时间'],a:[1],x:'规则先区分业务类型，再以提交顺序排列各类型内部的申请；无法推出不同类型间必须如何交叉排序。'},
{id:'E92',area:'epi',topic:'资料分析',level:'基础',q:'某系统本期处理540笔，比上期增加80%。上期处理多少笔？',o:['270','300','320','432'],a:[1],x:'本期=上期×(1+80%)=上期×1.8，因此上期=540÷1.8=300笔。'},
{id:'E93',area:'epi',topic:'排列组合',level:'进阶',q:'4名不同员工中安排1人值早班、另1人值晚班，每班只需1人，且甲不能值早班。共有多少种排法？',o:['6','8','9','12'],a:[2],x:'早班从除甲外3人中选，晚班再从剩余3人中选；班次区分先后，共3×3=9种。'},
{id:'E94',area:'epi',topic:'资料分析',level:'进阶',q:'五笔模拟账单金额从小到大依次为10、20、20、30、70元。下列哪些说法正确？（多选）',o:['合计150元','平均金额30元','中位数20元','去掉70元后平均金额为25元'],a:[0,1,2],x:'合计10+20+20+30+70=150元，平均150÷5=30元，第3项为中位数20元；去掉70元后80÷4=20元。'},
{id:'E95',area:'epi',topic:'判断推理',level:'进阶',q:'四项不同的对账任务A、B、C、D依次执行，规定A必须早于B、B必须早于C，D不受限制。以下哪个执行顺序可能成立？',o:['A→B→C→D','B→A→C→D','C→A→B→D','A→C→B→D'],a:[0],x:'限制构成A→B→C的先后链；第一项满足该链，其余三项分别违反A早于B或B早于C。'},
{id:'E96',area:'epi',topic:'图形规律',level:'基础',q:'文字描述一组方向图：↑、→、↓、←、（ ）。若每次顺时针旋转90°，空格处是什么？',o:['↑','→','↓','←'],a:[0],x:'向左箭头←顺时针旋转90°后指向上方↑，与方向按上、右、下、左循环的规律一致。'},
{id:'E97',area:'epi',topic:'数量关系',level:'基础',q:'某网点的矩形自助服务区长12米、宽8米。沿外围布置一圈连续隔离带，不计接头损耗，至少需要多少米？',o:['20米','32米','40米','96米'],a:[2],x:'外围长度即矩形周长，2×(12+8)=40米；12×8=96是面积，不是隔离带长度。'},
{id:'E98',area:'epi',topic:'言语理解',level:'基础',q:'“部分咨询工单由机器人自动答复，涉及复杂争议的工单仍转交人工处理。”据此可以确定什么？',o:['所有工单都无需人工介入','复杂争议工单仍有人工作业环节','机器人能解决全部复杂争议','工单都只能由人工处理'],a:[1],x:'题干明确复杂争议工单转人工，表明这类工单仍有人工作业；其余选项把“部分”或“复杂”扩大为全部。'},
{id:'E99',area:'epi',topic:'组合数学',level:'进阶',q:'4条不同的系统告警逐条标记为“需复核”或“无需复核”，每条仅标记一种状态。下列哪些说法正确？（多选）',o:['恰有1条需复核共有4种标记','恰有2条需复核共有6种标记','4条都无需复核只有1种标记','恰有3条需复核共有8种标记'],a:[0,1,2],x:'分别从4条中选1、2、0、3条需复核，对应C(4,1)=4、C(4,2)=6、C(4,0)=1、C(4,3)=4种；末项8错误。'},
{id:'E100',area:'epi',topic:'数量关系',level:'进阶',q:'甲自助终端每小时办理18笔，乙每小时办理12笔，速率均恒定。甲先单独运行1小时，随后两台同时运行2小时，共办理多少笔？',o:['60','72','78','90'],a:[2],x:'甲单独1小时办18笔；随后两台合计每小时办18+12=30笔，2小时办60笔；总计18+60=78笔。'},
{id:'N01',area:'english',topic:'词汇语法',level:'基础',q:'The team will _____ the backup system before the next release.',o:['test','testing','tested','tests'],a:[0],x:'助动词 will 后接动词原形 test。'},
{id:'N02',area:'english',topic:'词汇语法',level:'基础',q:'Customer data must be stored _____, with access limited to authorized staff.',o:['secure','security','securely','securing'],a:[2],x:'修饰动词 stored，应使用副词 securely。'},
{id:'N03',area:'english',topic:'词汇语法',level:'基础',q:'If the network had failed yesterday, the system _____ switched to the standby site.',o:['will have','would have','would','has'],a:[1],x:'与过去事实相反的虚拟条件句：If + had done，主句 would have done。'},
{id:'N04',area:'english',topic:'词汇语法',level:'基础',q:'The bank is committed _____ improving the reliability of its services.',o:['at','to','for','with'],a:[1],x:'固定搭配 be committed to doing sth.。'},
{id:'N05',area:'english',topic:'词汇语法',level:'基础',q:'Please _____ the logs before reporting the incident.',o:['review','reviewing','reviewed','reviews'],a:[0],x:'该句是提出操作要求的祈使句，句首使用动词原形 review；其余词形不能直接作祈使句谓语。'},
{id:'N06',area:'english',topic:'词汇语法',level:'基础',q:'The update was delayed _____ the final security check was not complete.',o:['although','because','unless','whereas'],a:[1],x:'后半句给出延期原因，应选 because。'},
{id:'N07',area:'english',topic:'词汇语法',level:'基础',q:'All applications should be _____ regularly to reduce known vulnerabilities.',o:['patch','patching','patched','patches'],a:[2],x:'被动语态 should be + 过去分词 patched。'},
{id:'N08',area:'english',topic:'词汇语法',level:'进阶',q:'By the time the monitoring alert arrived, the engineer _____ the issue.',o:['had identified','identifies','will identify','has identify'],a:[0],x:'先于过去某一时刻发生的动作，使用过去完成时 had identified。'},
{id:'N09',area:'english',topic:'阅读理解',level:'基础',q:'Read: “During a weekend upgrade, the team kept the old system available until the new one passed all checks. Customers did not need to change their accounts.” What happened before the old system was retired?',o:['Customers opened new accounts','The new system passed all checks','All services were suspended','Account balances were reset'],a:[1],x:'原文明确是“until the new one passed all checks”。'},
{id:'N10',area:'english',topic:'阅读理解',level:'基础',q:'Read: “The pilot reduced average response time from 200 ms to 150 ms, but the team will monitor performance during peak traffic.” Which statement is supported?',o:['Peak traffic performance is already proven','Average response time fell by 50%','The team will continue monitoring peak traffic','The pilot lasted exactly one year'],a:[2],x:'文段最后明确写继续监测峰值流量；200ms到150ms降低25%，而非50%。'},
{id:'N11',area:'english',topic:'词汇语法',level:'基础',q:'A secure payment platform should remain _____ even when one server fails.',o:['available','availability','availably','avail'],a:[0],x:'系动词 remain 后接形容词 available。'},
{id:'N12',area:'english',topic:'阅读理解',level:'进阶',q:'Read: “The team restored service in 30 minutes. However, the root cause remains under investigation.” Which claim is NOT justified?',o:['Service was restored','The root cause is already known','Recovery took 30 minutes','Investigation is ongoing'],a:[1],x:'原文既说服务在30分钟内恢复，也说根因仍在调查；因此“根因已经明确”与原文矛盾。'},
{id:'N13',area:'english',topic:'选词辨析',level:'基础',q:'The report contains unmasked account numbers and must be accessible only to approved auditors; it is _____.',o:['public','confidential','open-access','published'],a:[1],x:'含未脱敏账号且仅限获批人员查阅，直接支持 confidential（机密的）；题干没有说明报告是否已经发布，published 不能据此选定。'},
{id:'N14',area:'english',topic:'选词辨析',level:'基础',q:'The help desk must _____ a caller’s identity before resetting a password.',o:['assume','expose','verify','guess'],a:[2],x:'重置密码前必须核实来电者身份，用 verify；猜测或直接假定身份不符合语境。'},
{id:'N15',area:'english',topic:'选词辨析',level:'基础',q:'To reduce database load, the team placed a cache _____ the application and the database.',o:['among','during','along','between'],a:[3],x:'明确指应用与数据库两个端点之间，用 between；among 用于群体内部，另两项不表示此位置关系。'},
{id:'N16',area:'english',topic:'选词辨析',level:'基础',q:'After confirming the duplicate charge, the bank _____ the extra fee to the customer.',o:['refunded','charged','deducted','retained'],a:[0],x:'确认重复收费后向客户退还费用，用 refunded；其余分别是收费、扣除、保留。'},
{id:'N17',area:'english',topic:'选词辨析',level:'进阶',q:'The security patch fixes a _____ that could allow unauthorized access to customer records.',o:['dashboard','vulnerability','capacity','schedule'],a:[1],x:'可能造成未授权访问的缺陷是安全漏洞 vulnerability；补丁修复的是漏洞而非看板、容量或日程。'},
{id:'N18',area:'english',topic:'选词辨析',level:'基础',q:'The monitoring dashboard should _____ unusual spikes in failed login attempts and notify the security team.',o:['approve','conceal','detect','ignore'],a:[2],x:'监控看板应发现异常并通知安全团队，用 detect；批准、掩盖、忽略均与告警目的相反。'},
{id:'N19',area:'english',topic:'虚拟语气',level:'进阶',q:'If the backup server were online now, the service _____ available during this outage.',o:['had remained','will have remained','remains','would remain'],a:[3],x:'were online now 表示与现在事实相反的假设，主句用 would + 动词原形，故选 would remain。'},
{id:'N20',area:'english',topic:'虚拟语气',level:'进阶',q:'If the engineers had renewed the certificate before it expired last night, the login service _____ offline.',o:['would not have gone','will not go','does not go','had not gone'],a:[0],x:'had renewed 表示与昨晚事实相反，主句需用 would not have + 过去分词，表示本可避免离线。'},
{id:'N21',area:'english',topic:'虚拟语气',level:'进阶',q:'The security policy requires that every privileged account _____ reviewed monthly.',o:['being','be','been','to be'],a:[1],x:'require that 后表示要求的从句使用动词原形；被动结构为 be reviewed。'},
{id:'N22',area:'english',topic:'虚拟语气',level:'进阶',q:'It is essential that the backup keys _____ stored in separate locations.',o:['being','been','be','to be'],a:[2],x:'It is essential that 引出建议性虚拟语气，从句用原形 be，构成 be stored。'},
{id:'N23',area:'english',topic:'非谓语动词',level:'基础',q:'To _____ accidental data exposure, the team masked account numbers in the demo.',o:['preventing','prevented','prevention','prevent'],a:[3],x:'表目的的不定式为 to + 动词原形；to prevent 意为“为防止”，其余词形不合结构。'},
{id:'N24',area:'english',topic:'非谓语动词',level:'进阶',q:'The audit team found several access logs _____ from the archive.',o:['missing','miss','to miss','missed'],a:[0],x:'find + 宾语 + 形容词性补语，missing 表示“发现日志缺失”；其余词形不能表达此状态。'},
{id:'N25',area:'english',topic:'非谓语动词',level:'基础',q:'The updated procedure allows staff _____ suspicious requests without opening attachments.',o:['reporting','to report','reported','report'],a:[1],x:'allow somebody to do something 是固定句型；此处应为 allows staff to report。'},
{id:'N26',area:'english',topic:'非谓语动词',level:'进阶',q:'The patch was tested in a sandbox before _____ to production.',o:['deploy','be deployed','being deployed','deploying'],a:[2],x:'补丁是“被部署”，介词 before 后用动名词被动形式 being deployed。'},
{id:'N27',area:'english',topic:'非谓语动词',level:'基础',q:'The engineer ran a script in order _____ the checksum of every uploaded file.',o:['verifying','verified','verify','to verify'],a:[3],x:'in order to do 表目的，后接动词原形 verify，表示运行脚本以核对校验和。'},
{id:'N28',area:'english',topic:'固定搭配',level:'基础',q:'The service team is responsible _____ notifying customers of scheduled maintenance.',o:['for','to','with','at'],a:[0],x:'be responsible for doing 意为“负责做某事”；for 后接动名词 notifying。'},
{id:'N29',area:'english',topic:'固定搭配',level:'基础',q:'Access to the secure vault is restricted _____ staff with two-factor authentication.',o:['for','to','on','by'],a:[1],x:'be restricted to 表示“仅限于”，这里仅允许具备双因素认证的员工访问。'},
{id:'N30',area:'english',topic:'固定搭配',level:'基础',q:'The bank must comply _____ its data-retention rules when deleting old records.',o:['to','for','with','at'],a:[2],x:'comply with rules 是“遵守规则”的固定搭配；其他介词不构成该表达。'},
{id:'N31',area:'english',topic:'固定搭配',level:'基础',q:'The support team followed up _____ the customer after resolving the login issue.',o:['for','by','at','with'],a:[3],x:'follow up with somebody 表示“与某人后续联系”，这里是故障解决后回访客户。'},
{id:'N32',area:'english',topic:'固定搭配',level:'进阶',q:'The incident report must distinguish _____ a temporary slowdown and a full outage.',o:['between','among','from','within'],a:[0],x:'distinguish between A and B 表示区分两者；若用 from，应写 distinguish A from B，不需本题空格。'},
{id:'N33',area:'english',topic:'阅读理解',level:'基础',q:'Read: “The security team sent a simulated sign-in email during training. Employees were told to report it using the internal button, not to click its link. Most employees reported it correctly.” What action was requested?',o:['Click the link to check the account','Report the email with the internal button','Forward the email to customers','Enter a password in the email'],a:[1],x:'原文明确要求用内部按钮报告邮件，且不要点击链接；其余均非训练要求。'},
{id:'N34',area:'english',topic:'阅读理解',level:'进阶',q:'Read: “In a weekday pilot, a new queue system reduced the average customer wait from eight minutes to five. Weekend service was not measured.” Which conclusion is supported?',o:['Weekend waits also fell by three minutes','All customers waited exactly five minutes','The average weekday pilot wait fell by three minutes','The pilot measured every branch'],a:[2],x:'工作日试点平均等候从8分钟降到5分钟，减少3分钟；周末未测，不能推断周末或每位客户情况。'},
{id:'N35',area:'english',topic:'阅读理解',level:'进阶',q:'Read: “The bank stores nightly backups in another region. In a Monday drill, staff recovered files from the Sunday backup in 20 minutes. Payment processing was not part of the drill.” What did the drill verify?',o:['Payment processing recovered in 20 minutes','Backups are made only on Sundays','The other region never loses power','Sunday backup files could be recovered in 20 minutes'],a:[3],x:'演练验证了周日备份的文件可在20分钟内恢复；支付处理未测试，也不能推断其他绝对结论。'},
{id:'N36',area:'english',topic:'阅读理解',level:'进阶',q:'Read: “A new release was sent to 5% of users. Error rates rose, so the operations team switched that traffic back to the previous release within ten minutes. The root cause is still unknown.” Which statement is supported?',o:['The team reverted the affected traffic within ten minutes','The new release reached all users','The root cause has been confirmed','Error rates stayed unchanged'],a:[0],x:'文段明确5%流量在十分钟内回切旧版；不是全部用户，且错误率上升、根因未明。'},
{id:'N37',area:'english',topic:'阅读理解',level:'基础',q:'Read: “Customers who cannot receive an SMS code may verify their identity at a branch. Support agents must never ask customers to disclose a one-time code by phone.” What should a customer without SMS access do?',o:['Tell the agent a one-time code','Verify identity at a branch','Skip identity verification entirely','Share a password over the phone'],a:[1],x:'无法接收短信验证码者可前往网点核验身份；电话透露一次性验证码被明确禁止。'},
{id:'N38',area:'english',topic:'完形选词',level:'基础',q:'Read and fill in the blank: “The monitoring system measured latency every minute. If a spike lasted over five minutes, it alerted engineers so they could _____ the cause before customers reported failures.”',o:['conceal','celebrate','investigate','ignore'],a:[2],x:'告警是为了让工程师提前调查延迟升高的原因，investigate the cause 最符合因果关系。'},
{id:'N39',area:'english',topic:'完形选词',level:'基础',q:'Read and fill in the blank: “Before sharing a data export for testing, the analyst replaced each account number with a random token. This step was intended to _____ direct identification of customers.”',o:['enable','accelerate','require','prevent'],a:[3],x:'用随机标记替代账号旨在防止直接识别客户，prevent 与目的吻合；其余均与去标识化目的相反。'},
{id:'N40',area:'english',topic:'完形选词',level:'进阶',q:'Read and fill in the blank: “During a planned software release, the team kept the previous version ready. If the new version failed validation, they would _____ to the previous one.”',o:['roll back','scale up','log in','sign up'],a:[0],x:'新版验证失败时回退旧版，roll back to the previous one 是符合发布运维语境的表达。'},
{id:'N41',area:'english',topic:'完形选词',level:'进阶',q:'Read and fill in the blank: “A customer asked to cancel a transfer. The agent saw that it was still pending; completed transfers require a separate dispute process. The agent could cancel it because it had not yet been _____.”',o:['requested','completed','recorded','initiated'],a:[1],x:'仍处于 pending 意味着尚未完成；已完成的转账须走另一流程，所以空处为 completed。'},
{id:'N42',area:'english',topic:'完形选词',level:'进阶',q:'Read and fill in the blank: “The API rejects requests without a valid access token, even if a user knows its endpoint address. Knowing the address alone does not _____ permission to use the service.”',o:['revoke','record','grant','renew'],a:[2],x:'知道接口地址不会自动赋予访问权限，grant permission 是“授予权限”的固定表达。'},
{id:'N43',area:'english',topic:'阅读理解·零售服务',level:'基础',q:'Read: “At 9:00, the service desk calls customers with 9:00 appointments before walk-ins, regardless of when the walk-ins arrived. Mia has a 9:00 appointment. Leo arrived at 8:50 without one.” Who is called first under this rule?',o:['Leo, because he arrived earlier','Mia, because she has a 9:00 appointment','Both at exactly the same time','Neither until 10:00'],a:[1],x:'规则明确9点先叫9点预约客户，不受散客到达时间影响；Mia有预约，Leo虽8:50先到却无预约，因此选Mia。'},
{id:'N44',area:'english',topic:'阅读理解·零售服务',level:'基础',q:'Read: “The sample service center offers account statements online. Customers who cannot use the website may request printed statements at the counter at no additional charge.” Which option is available to a customer who cannot use the website?',o:['Only closing the account','A printed statement at the counter without an extra charge','A printed statement only after paying a new fee','No way to obtain a statement'],a:[1],x:'文段第二句明确无法使用网站的客户可在柜台免费索取纸质对账单；其他选项要么否认该渠道，要么凭空增加费用。'},
{id:'N45',area:'english',topic:'完形选词·零售服务',level:'基础',q:'Read and fill in the blank: “A customer asked why a monthly service fee appeared. The adviser showed the stated fee conditions and explained which condition applied to this account. The adviser aimed to _____ the charge, not hide it.”',o:['duplicate','clarify','invent','conceal'],a:[1],x:'展示收费条件并说明适用依据是在解释、澄清收费，故用 clarify；duplicate 是重复，invent 是编造，conceal 是掩盖，均与 not hide it 不符。'},
{id:'N46',area:'english',topic:'阅读理解·数字银行',level:'进阶',q:'Read: “In this fictional app, an authorization appears as pending. Only posted transactions are included in the monthly statement. A purchase is pending on Tuesday and posted on Wednesday.” On which day does this purchase first meet the stated condition for inclusion in the monthly statement?',o:['Tuesday, when it is pending','Wednesday, when it is posted','Both days as two purchases','Never, because it was once pending'],a:[1],x:'题干直接限定只有已入账的 posted 交易计入月结单；该笔周三才 posted，因此周三首次满足纳入月结单的条件；周二的 pending 状态不满足条件。'},
{id:'N47',area:'english',topic:'阅读理解·数字银行',level:'基础',q:'Read: “A user receives an alert about a sign-in from a new device that the user does not recognize. The app instructs users to open its security center directly to review sessions, not to reply to alert messages.” What should this user do first?',o:['Reply to the alert with a password','Ignore the unrecognized sign-in','Open the security center directly to review sessions','Send the alert to every contact'],a:[2],x:'文段要求遇到不认识的新设备登录时直接进入应用的安全中心检查会话，并明确不要回复提醒消息；因此选直接查看会话。'},
{id:'N48',area:'english',topic:'完形选词·数字银行',level:'进阶',q:'Read and fill in the blank: “The mobile app saves an unfinished form locally when the connection drops. Once the connection returns, the user can _____ the form from the last saved step instead of starting over.”',o:['resume','erase','duplicate','reject'],a:[0],x:'断网时保留未填完的表单，联网后从上次保存处继续，应选 resume（继续）；erase、duplicate、reject 分别是删除、复制、拒绝，均与 instead of starting over 冲突。'},
{id:'N49',area:'english',topic:'阅读理解·运营',level:'基础',q:'Read: “For this exercise, 80 requests arrived before the 16:00 review cutoff and 20 arrived after it. All 80 earlier requests are scheduled for review today, while the 20 later requests are scheduled for tomorrow.” How many requests are scheduled for review today?',o:['20','60','80','100'],a:[2],x:'原文明确说明截止前的80笔全部安排今天复核，截止后的20笔安排明天，因此今天是80笔。'},
{id:'N50',area:'english',topic:'阅读理解·运营',level:'进阶',q:'Read: “The operations team compared 120 entries with source records. They matched 116 entries and set aside the remaining entries for investigation; no result has yet been assigned to those remaining entries.” How many entries remain to be investigated?',o:['4','16','116','120'],a:[0],x:'总计120条，已匹配116条，剩余120−116=4条待调查；题干未给这4条定性，不能将其说成已确认错误。'},
{id:'N51',area:'english',topic:'阅读理解·运营',level:'进阶',q:'Read: “In this support workflow, an agent may mark a ticket resolved only after the customer confirms that the problem is gone. The agent has applied a fix but has not yet received confirmation.” What is the ticket status under this rule?',o:['It must already be resolved','It remains unconfirmed and cannot yet be marked resolved','It must be deleted immediately','It is automatically a new ticket'],a:[1],x:'工作流规定已解决状态以客户确认问题消失为前提；虽然坐席已应用修复，但尚未收到确认，所以还不能标记为 resolved。'},
{id:'N52',area:'english',topic:'阅读理解·风控',level:'进阶',q:'Read: “A test rule flagged 50 transactions for review. Analysts completed reviews of 10 and confirmed that 3 of those 10 were fraudulent. The other 40 have not been reviewed.” Which claim is supported?',o:['All 50 are confirmed fraudulent','Exactly 3 reviewed transactions were confirmed fraudulent','The 40 unreviewed transactions are legitimate','All 10 reviewed transactions were legitimate'],a:[1],x:'已完成复核的10笔中有3笔确认欺诈，这是唯一有明确证据的数量；剩余40笔未复核，不能判断其真伪，也不能推断50笔全部欺诈。'},
{id:'N53',area:'english',topic:'阅读理解·风控',level:'基础',q:'Read: “An applicant entered an income figure that did not match an uploaded document. The reviewer asked for a corrected document before making a decision; no approval or rejection has been issued.” What has happened so far?',o:['The application has been rejected','The reviewer has requested a corrected document','The application has been approved','The income figure has been verified as correct'],a:[1],x:'文段明确审核员要求补交更正文件，且尚未作出批准或拒绝决定；不能把补件要求误读为审批结果。'},
{id:'N54',area:'english',topic:'完形选词·风控',level:'进阶',q:'Read and fill in the blank: “A missing merchant category code causes the rule engine to route a transaction to an analyst. The flag is a signal for additional _____, not proof of fraud.”',o:['review','approval','deletion','advertising'],a:[0],x:'交易被路由给分析员且标记并非欺诈定论，表示需要进一步 review（复核）；approval、deletion、advertising 都不能表达核实风险信号。'},
{id:'N55',area:'english',topic:'阅读理解·科技项目',level:'基础',q:'Read: “The project team froze new features on Friday. Defect fixes may continue until Tuesday, while feature requests submitted after Friday move to the next cycle.” Which work may still continue before Tuesday?',o:['Adding every new feature request','Defect fixes','Skipping all testing','Moving the next cycle into Friday'],a:[1],x:'原文区分“新功能冻结”和“缺陷修复可持续到周二”；因此这段时间仍允许缺陷修复，新增功能请求则移到下个周期。'},
{id:'N56',area:'english',topic:'阅读理解·科技项目',level:'进阶',q:'Read: “The team agreed that a translated instruction sheet must be ready before the pilot begins. Translation finished one day late, so the pilot was moved back one day; it was not canceled.” What was the effect of the translation delay?',o:['The pilot was canceled','The pilot started one day early','The pilot was postponed by one day','The instruction sheet was no longer needed'],a:[2],x:'译文是试点前置条件，晚完成一天后试点也顺延一天；文段还明确“未取消”，故 postponed by one day 唯一符合。'},
{id:'N57',area:'english',topic:'完形选词·科技项目',level:'进阶',q:'Read and fill in the blank: “The team defined acceptance criteria before development. A screen that opens successfully may still fail those criteria if required fields are missing. The delivery must _____ the agreed criteria before acceptance.”',o:['meet','replace','postpone','erase'],a:[0],x:'能打开页面不等于满足含必填字段在内的验收标准；交付物须 meet the agreed criteria（符合既定标准），其他动词都不表示达标。'},
{id:'N58',area:'english',topic:'阅读理解·数字银行',level:'进阶',q:'Read: “Twelve volunteers using screen readers tried a prototype. Nine completed the balance-check task without help; three needed assistance. No other users were tested.” Which statement is justified?',o:['All users can complete the task without help','Nine of the twelve tested volunteers completed the task without help','The prototype works for every screen reader','No tested volunteer needed assistance'],a:[1],x:'样本内12人中9人独立完成，3人需要帮助；只能陈述样本观察结果，不能外推到所有用户或所有读屏软件。'},
{id:'N59',area:'english',topic:'阅读理解·零售服务',level:'进阶',q:'Read: “A survey invitation went to 400 customers. Eighty responded, and 60 of those respondents rated the service positively. The other invited customers did not respond.” What percentage of respondents rated the service positively?',o:['15%','20%','75%','80%'],a:[2],x:'问题问的是回复者中的积极评价比例，分母是80名回复者，不是400名受邀者；60÷80=75%。'},
{id:'N60',area:'english',topic:'完形选词·运营',level:'基础',q:'Read and fill in the blank: “With fewer staff on a public holiday, the manager handled urgent requests first and scheduled non-urgent ones for the following day. The non-urgent requests were _____, not canceled.”',o:['deferred','completed','destroyed','denied'],a:[0],x:'非紧急请求被安排到次日且并未取消，即推迟处理，故用 deferred；completed 是已完成，destroyed 和 denied 也与安排次日处理矛盾。'},
{id:'N61',area:'english',topic:'语法·零售服务',level:'基础',q:'The adviser explained both account options clearly _____ customers could compare them before choosing.',o:['despite','so that','unless','whereas'],a:[1],x:'后半句 customers could compare them 表示清楚解释的目的，so that 引导目的状语从句；despite 不能直接接完整从句，unless 表条件，whereas 表对比。'},
{id:'N62',area:'english',topic:'语法·数字银行',level:'基础',q:'Only users who have opted in _____ the optional spending alerts each week.',o:['receives','to receive','receive','receiving'],a:[2],x:'主语 users 为复数，each week 表经常性动作，应选一般现在时复数谓语 receive；其他三项不能独立作该主语的正确谓语。'},
{id:'N63',area:'english',topic:'选词辨析·运营',level:'基础',q:'A two-cent discrepancy should be _____ in the reconciliation log, even if it is resolved later.',o:['recorded','disguised','guessed','deleted'],a:[0],x:'即使差额随后得到解决，仍需在对账日志留下记录，recorded 表示“被记录”；其余是掩盖、猜测或删除，均非留痕。'},
{id:'N64',area:'english',topic:'选词辨析·风控',level:'进阶',q:'The analyst requested a second document to _____ the income figure in the application with independent evidence.',o:['inflate','ignore','overwrite','corroborate'],a:[3],x:'第二份独立材料用于印证申请中的收入数字，corroborate 指用其他证据支持或核实；inflate、ignore、overwrite 分别是夸大、忽略、覆盖。'},
{id:'N65',area:'english',topic:'选词辨析·科技项目',level:'进阶',q:'The plan records a _____ between data migration and acceptance testing: the tests cannot begin until sample data arrives.',o:['decoration','dependency','discount','coincidence'],a:[1],x:'测试必须等迁移后的样例数据到位才能开始，存在先后依赖，故选 dependency；其他词分别指装饰、折扣、巧合。'},
{id:'N66',area:'english',topic:'语法·运营',level:'进阶',q:'Neither the branch manager nor the two tellers _____ scheduled to attend tomorrow’s briefing.',o:['is','am','are','be'],a:[2],x:'neither ... nor ... 连接两个主语时通常按就近原则与靠近谓语的 the two tellers（复数）一致，因此用 are scheduled；其余形式不合主谓一致或句法。'},
{id:'N67',area:'english',topic:'语法·零售服务',level:'基础',q:'In the same user test, participants found the revised help page easier to understand _____ the previous version.',o:['than','then','as','from'],a:[0],x:'easier 是比较级，比较两个版本应搭配 than；then 表时间顺序，as 和 from 不与此处比较级构成正确结构。'},
{id:'N68',area:'english',topic:'选词辨析·科技项目',level:'进阶',q:'Rather than closing an issue without a decision, the project lead will _____ it to the steering group for a decision.',o:['conceal','discard','escalate','settle'],a:[2],x:'未决问题上交指导组作决定是 escalate an issue to ...（升级提交问题）；conceal、discard 是隐瞒或丢弃，settle 是自行解决，与交由指导组决策不符。'},
{id:'N69',area:'english',topic:'选词辨析·数字银行',level:'基础',q:'Before sending optional marketing messages, the form asks users to actively tick an unchecked box, providing _____ consent.',o:['assumed','explicit','accidental','silent'],a:[1],x:'用户须主动勾选原本未勾选的方框，属于明确表达同意，即 explicit consent；并非推定、意外或默示同意。'},
{id:'N70',area:'english',topic:'语法·科技项目',level:'进阶',q:'The pilot met its speed target but failed the accessibility test. It _____ the accessibility target, so the team revised the design.',o:['met','has met','will meet','did not meet'],a:[3],x:'题干已明确无障碍测试失败，且叙述的是已完成试点，因此应为 did not meet（未达到）；其余选项都表达已达标或将达标，违背事实。'},
{id:'N71',area:'english',topic:'选词辨析·运营',level:'基础',q:'Under this daily schedule, a request arriving after the processing cutoff is queued for the _____ cycle, not the one that has just closed.',o:['previous','next','closed','canceled'],a:[1],x:'当天处理截止后到达的请求不能进入刚结束的一轮，只能排入下一轮 next cycle；其余选项与截止后排队这一条件矛盾。'},
{id:'N72',area:'english',topic:'选词辨析·科技项目',level:'进阶',q:'The release notes link each change to a request ID, giving reviewers a _____ record of why the change was made.',o:['traceable','invisible','random','unrelated'],a:[0],x:'每项变更关联请求编号，审阅者即可循编号追溯变更原因，故用 traceable（可追溯的）；其余形容词与关联记录相反。'},
{id:'T01',area:'tech',topic:'数据库',level:'基础',q:'在常见关系型数据库中，只想删除某表里符合条件的行，而保留表结构，通常使用哪个语句？',o:['DROP TABLE','DELETE FROM ... WHERE ...','CREATE TABLE','ALTER TABLE'],a:[1],x:'DELETE 删除行；DROP TABLE 删除整个表对象。具体事务及自增行为依数据库产品而异。'},
{id:'T02',area:'tech',topic:'数据库',level:'基础',q:'SQL 中 COUNT(column_name) 对该列的 NULL 值如何处理？',o:['全部计入','跳过NULL','报错','返回NULL'],a:[1],x:'COUNT(列)统计非NULL值；COUNT(*)统计行数。'},
{id:'T03',area:'tech',topic:'数据库',level:'基础',q:'要保留左表的全部记录，即使右表没有匹配，也返回左表行，应使用哪种连接？',o:['INNER JOIN','LEFT JOIN','CROSS JOIN','仅用 WHERE'],a:[1],x:'LEFT JOIN 会保留左表所有行，未匹配的右侧列填NULL。'},
{id:'T04',area:'tech',topic:'数据库',level:'进阶',q:'数据库事务的“原子性”主要指什么？',o:['事务内操作要么全部成功要么全部失败','每条查询都必须毫秒级完成','数据只能存一个节点','事务无需日志'],a:[0],x:'ACID 中 Atomicity 表示事务作为不可再分的执行单元提交或回滚。'},
{id:'T05',area:'tech',topic:'数据库',level:'进阶',q:'关于常见 B+ 树索引，下列说法正确的是？',o:['通常可支持范围查询','只能做全表扫描','任何查询都必然走索引','索引不占磁盘空间'],a:[0],x:'B+树叶节点有序，适合范围查询；是否走索引仍取决于优化器、过滤条件等。'},
{id:'T06',area:'tech',topic:'计算机网络',level:'基础',q:'TCP 建立连接的典型三次握手顺序是？',o:['ACK→SYN→FIN','SYN→SYN+ACK→ACK','FIN→FIN+ACK→ACK','SYN→ACK→SYN'],a:[1],x:'客户端SYN，服务端SYN+ACK，客户端ACK。'},
{id:'T07',area:'tech',topic:'计算机网络',level:'基础',q:'HTTP 404 状态码一般表示什么？',o:['服务器内部错误','请求资源未找到','认证成功','永久重定向'],a:[1],x:'404 Not Found 表示请求的资源未找到。'},
{id:'T08',area:'tech',topic:'计算机网络',level:'基础',q:'HTTPS 通常用什么协议保护传输层之上的应用数据？',o:['TLS','FTP','ARP','ICMP'],a:[0],x:'HTTPS 使用 TLS 提供传输加密与服务器身份校验等能力。'},
{id:'T09',area:'tech',topic:'计算机网络',level:'进阶',q:'一个传统 IPv4 /27 子网，排除网络地址和广播地址后，可分配给主机的地址通常有多少个？',o:['14','30','32','62'],a:[1],x:'/27 留5位主机位，2^5=32个地址，减去网络地址和广播地址通常剩30个。'},
{id:'T10',area:'tech',topic:'计算机网络',level:'基础',q:'在 OSI 模型中，负责跨网络逻辑寻址与路由选择的主要是哪一层？',o:['物理层','数据链路层','网络层','表示层'],a:[2],x:'网络层负责逻辑地址和跨网络转发，IP 地址及路由选择属于这一层；数据链路层更侧重同一链路上的帧传输。'},
{id:'T11',area:'tech',topic:'操作系统',level:'基础',q:'进程进入等待磁盘 I/O 完成的状态时，通常处于哪种状态？',o:['运行态','就绪态','阻塞态','终止态'],a:[2],x:'等待 I/O 事件时是阻塞态；事件完成后可回到就绪态。'},
{id:'T12',area:'tech',topic:'操作系统',level:'进阶',q:'访问的虚拟页不在内存中时，操作系统通常会触发什么？',o:['缺页异常','DNS查询','SQL回滚','线程创建'],a:[0],x:'页不在内存会发生缺页异常（page fault），操作系统再按需调入页面。'},
{id:'T13',area:'tech',topic:'操作系统',level:'进阶',q:'下列哪些属于产生死锁的经典必要条件？（多选）',o:['互斥','请求并保持','不可剥夺','循环等待'],a:[0,1,2,3],x:'互斥、请求并保持、不可剥夺、循环等待四个条件同时成立才可能死锁。'},
{id:'T14',area:'tech',topic:'操作系统',level:'基础',q:'在常见 Linux 环境中，想查看当前进程信息与终止指定进程，常用的两个命令分别是什么？',o:['ps 与 kill','mkdir 与 cd','grep 与 sort','cat 与 pwd'],a:[0],x:'ps 可列出进程信息，kill 向进程发送信号。'},
{id:'T15',area:'tech',topic:'数据结构',level:'基础',q:'对无权图求从起点到各节点的最少边数，常用哪种遍历及核心容器？',o:['DFS + 栈','BFS + 队列','二分查找 + 数组','拓扑排序 + 堆'],a:[1],x:'广度优先搜索按层推进，用队列实现，可求无权图最短边数。'},
{id:'T16',area:'tech',topic:'数据结构',level:'基础',q:'对长度为 n 的有序数组做二分查找，最坏时间复杂度是？',o:['O(1)','O(log n)','O(n)','O(n²)'],a:[1],x:'每次缩小约一半搜索区间，最坏 O(log n)。'},
{id:'T17',area:'tech',topic:'数据结构',level:'基础',q:'一棵二叉树的前序遍历访问顺序是？',o:['左→根→右','根→左→右','左→右→根','根→右→左'],a:[1],x:'前序：根、左、右；中序：左、根、右；后序：左、右、根。'},
{id:'T18',area:'tech',topic:'算法',level:'进阶',q:'经典 Dijkstra 最短路算法通常要求边权满足什么条件？',o:['全部相等','非负','必须为整数','必须有环'],a:[1],x:'经典 Dijkstra 适用于非负边权；负权边可能使贪心确定的距离失效。'},
{id:'T19',area:'tech',topic:'算法',level:'基础',q:'平均情况下，用哈希表按键查找一个元素的时间复杂度通常是？',o:['O(1)','O(log n)','O(n)','O(n²)'],a:[0],x:'散列分布合理时平均 O(1)，极端碰撞等情况下不能保证恒为 O(1)。'},
{id:'T20',area:'tech',topic:'程序语言',level:'基础',q:'在 C/C++ 头文件中，#ifndef、#define、#endif 组合常用于什么？',o:['避免同一翻译单元重复包含头文件','给函数添加异常处理','动态分配内存','创建线程'],a:[0],x:'条件编译头文件保护宏可避免重复声明/定义问题。'},
{id:'T21',area:'tech',topic:'程序语言',level:'进阶',q:'Java 中比较两个字符串的内容是否相同，通常应使用什么？',o:['==','equals()','hashCode() 是否相同即可','instanceof'],a:[1],x:'String.equals() 比较字符内容；== 比较引用是否指向同一对象。'},
{id:'T22',area:'tech',topic:'信息安全',level:'基础',q:'以下哪个属于常见的对称加密算法？',o:['RSA','ECC','AES','SHA-256'],a:[2],x:'AES是对称加密；RSA/ECC常见于非对称密码体系；SHA-256是哈希函数。'},
{id:'T23',area:'tech',topic:'信息安全',level:'基础',q:'用户输入直接拼接到 SQL 字符串，最直接增加了什么风险？',o:['SQL注入','分布式死锁','DNS缓存污染','内存碎片'],a:[0],x:'用户输入可改变SQL语义；优先使用参数化查询，并落实权限控制。'},
{id:'T24',area:'tech',topic:'软件测试',level:'基础',q:'白盒测试与黑盒测试的主要区别是什么？',o:['白盒关注内部逻辑路径，黑盒主要按外部行为验证','白盒不需要运行程序','黑盒只能测试界面','两者完全相同'],a:[0],x:'白盒可按代码分支、路径设计用例；黑盒以需求及输入输出行为为主要依据。'},
{id:'T25',area:'tech',topic:'机器学习',level:'基础',q:'训练集效果很好、验证集效果明显下降，首先怀疑什么？',o:['欠拟合','过拟合','样本完全一致','模型没有参数'],a:[1],x:'泛化差是过拟合典型迹象；可尝试正则化、更多数据或降低复杂度等。'},
{id:'T26',area:'tech',topic:'软件工程',level:'基础',q:'需求频繁调整、希望短周期交付反馈时，以下哪种开发思路更贴近需求？',o:['完全不做测试','迭代式开发','仅在项目结束时验收','禁止变更'],a:[1],x:'迭代式开发强调短周期交付与反馈；银行生产系统仍需满足测试、变更及合规要求。'},
{id:'T27',area:'tech',topic:'信息安全',level:'进阶',q:'发生数据泄露风险时，下列哪些做法有助于遵循最小权限原则？（多选）',o:['按岗位授予必要权限','定期审查高权限账号','所有员工共用管理员账号','离职后及时撤销权限'],a:[0,1,3],x:'最小权限、权限复核、及时回收是常见控制；共用管理员账号不利于追责和隔离。'},
{id:'T28',area:'tech',topic:'云与运维',level:'进阶',q:'一个系统声称 RPO 为 5 分钟，最准确的含义是什么？',o:['故障后必须在5分钟内恢复服务','允许的数据丢失窗口目标不超过5分钟','每5分钟必须切换主备','数据库查询平均耗时5分钟'],a:[1],x:'RPO是恢复点目标，约束可接受的数据丢失范围；RTO才关注服务恢复时长目标。'},
{id:'T29',area:'tech',topic:'数据库',level:'进阶',q:'查询使用 WHERE user_id = ?，并频繁按 user_id 精确检索，以下哪个优化建议通常最直接？',o:['针对user_id评估建立索引','删除全部约束','无条件扩大返回字段','每次全表导出'],a:[0],x:'应结合数据分布、执行计划与写入代价评估索引，不是任何场景都一定提速。'},
{id:'T30',area:'tech',topic:'计算机网络',level:'进阶',q:'关于 TCP 与 UDP，下列哪些说法通常正确？（多选）',o:['TCP提供面向连接的字节流服务','UDP天然保证可靠有序到达','UDP以数据报为单位','应用可以在UDP之上实现自己的重传逻辑'],a:[0,2,3],x:'UDP本身不保证可靠有序；应用层可以设计重传、排序等机制。'},
{id:'T31',area:'tech',topic:'数据库与SQL',level:'基础',q:'按客户号分组后，仅筛出交易笔数超过10笔的客户，应把 COUNT(*) > 10 写在哪个子句？',o:['WHERE','HAVING','ORDER BY','LIMIT'],a:[1],x:'HAVING 在分组聚合后筛选组；WHERE 在分组前筛选行，不能直接用于筛选 COUNT(*) 的聚合结果。'},
{id:'T32',area:'tech',topic:'数据库与SQL',level:'基础',q:'要在 SQL 中找出手机号为 NULL 的记录，正确的筛选条件是？',o:['phone = NULL','phone IS NULL','phone == NULL','phone IN (NULL)'],a:[1],x:'判断 NULL 应使用 IS NULL；与 NULL 做普通等值比较结果为 UNKNOWN，不会筛出该行。'},
{id:'T33',area:'tech',topic:'数据库与SQL',level:'进阶',q:'关于 SQL 中 NULL 与计数的语义，哪些说法正确？（多选）',o:['COUNT(*) 会统计手机号为 NULL 的行','COUNT(phone) 会跳过 phone 为 NULL 的行','phone = NULL 可以可靠筛出 NULL 行','phone IS NULL 可用于筛出 NULL 行'],a:[0,1,3],x:'COUNT(*) 统计结果集行数，COUNT(phone) 只计非 NULL 值；判空须用 IS NULL，等号比较 NULL 得 UNKNOWN。'},
{id:'T34',area:'tech',topic:'数据库与SQL',level:'进阶',q:'某表建有普通 B+ 树联合索引 (user_id, created_at)。下列哪种过滤条件最符合最左前缀、通常能直接利用该索引定位记录？',o:['仅按 created_at = ? 过滤','按 user_id = ? 且 created_at >= ? 过滤','仅按非索引列 status = ? 过滤','不加过滤条件直接扫描全表'],a:[1],x:'联合索引以 user_id 为第一列；先等值匹配 user_id，再对 created_at 做范围检索符合最左前缀。实际执行计划仍取决于优化器。'},
{id:'T35',area:'tech',topic:'数据库与SQL',level:'进阶',q:'关于事务 ACID 属性，哪些说法正确？（多选）',o:['原子性要求事务整体提交或整体回滚','隔离性约束并发事务之间的可见性','持久性要求已提交结果在故障恢复后仍保留','一致性保证错误业务规则会被数据库自动修复'],a:[0,1,2],x:'原子性对应全成或全退；隔离性控制并发可见性；持久性保护提交结果。数据库不会自动纠正应用设计错误的业务规则。'},
{id:'T36',area:'tech',topic:'数据库与SQL',level:'基础',q:'某事务读取到另一事务尚未提交、随后被回滚的数据，这种现象称为什么？',o:['脏读','死锁','幻读','缓存穿透'],a:[0],x:'读取未提交数据并可能读到被回滚的值是脏读；与同一事务前后读到新增行的幻读不同。'},
{id:'T37',area:'tech',topic:'操作系统',level:'基础',q:'CPU 从一个可运行进程切换到另一个进程时，操作系统通常需要保存和恢复什么？',o:['进程的执行上下文（如寄存器状态）','磁盘的全部文件','路由器的转发表','所有数据库表'],a:[0],x:'进程上下文切换要保存当前执行状态并恢复目标进程的状态，寄存器等信息是典型内容。'},
{id:'T38',area:'tech',topic:'操作系统',level:'进阶',q:'在同一进程内创建多个线程，哪些说法通常正确？（多选）',o:['这些线程共享所属进程的地址空间','每个线程有自己的执行栈','所有线程共用同一个程序计数器和寄存器现场','共享可变数据时可能需要同步'],a:[0,1,3],x:'同进程线程共享地址空间，但各有执行栈和执行上下文；访问共享可变数据时须考虑竞态与同步。'},
{id:'T39',area:'tech',topic:'操作系统',level:'基础',q:'分页式虚拟内存中，页表的核心作用是记录哪类映射？',o:['虚拟页号到物理页框号','域名到 IP 地址','文件名到网络端口','线程名到 SQL 语句'],a:[0],x:'页表记录虚拟页到物理页框等信息，地址转换时再结合页内偏移。'},
{id:'T40',area:'tech',topic:'操作系统',level:'进阶',q:'内存只有3个页框且起初为空，按 LRU 策略依次访问页 A、B、C、A、D，访问 D 时淘汰哪个页？',o:['A','B','C','D'],a:[1],x:'前三次填入 A、B、C；再次访问 A 后最近使用次序为 B 最久、C 次之、A 最近，所以 D 到来时淘汰 B。'},
{id:'T41',area:'tech',topic:'操作系统',level:'进阶',q:'针对多个互斥锁的死锁风险，哪些措施能破坏经典死锁必要条件之一？（多选）',o:['所有线程按统一顺序获取锁，以避免循环等待','尝试获取下一把锁失败时，释放已持有的锁并稍后重试','仅提高 CPU 主频就能破坏循环等待','让线程永久持有已获取的锁'],a:[0,1],x:'统一加锁顺序破坏循环等待；获取下一把锁失败就释放已持有的锁，可避免一直请求并保持。提高主频或永久持锁不能从条件上消除死锁。'},
{id:'T42',area:'tech',topic:'操作系统',level:'基础',q:'用初值为1的计数信号量保护临界区，进入和离开时分别应执行哪组操作？',o:['进入 P（wait），离开 V（post）','进入 V，离开 P','进入时连续执行两次 V','进入和离开都只读信号量'],a:[0],x:'P/wait 获取许可，V/post 释放许可；初值为1时可作为互斥访问的基本手段。'},
{id:'T43',area:'tech',topic:'计算机网络',level:'基础',q:'传统 IPv4 子网 192.168.8.0/26 排除网络地址和广播地址后，通常有多少个可分配主机地址？',o:['30','62','64','126'],a:[1],x:'/26 保留6位主机位，共 2^6=64 个地址；传统子网去掉网络地址和广播地址，得到62个。'},
{id:'T44',area:'tech',topic:'计算机网络',level:'进阶',q:'关于 TCP 可靠传输，哪些说法正确？（多选）',o:['序号有助于接收端按字节流顺序重组数据','确认应答与超时重传可用于处理丢失的数据','TCP 会根据网络拥塞状态调整发送行为','IP 层保证所有 TCP 报文段永不丢失'],a:[0,1,2],x:'TCP 利用序号、确认与重传维持可靠有序的字节流，并有拥塞控制；IP 本身不保证报文不丢。'},
{id:'T45',area:'tech',topic:'计算机网络',level:'基础',q:'DNS 中用于把域名映射到 IPv6 地址的记录类型是？',o:['A','AAAA','MX','CNAME'],a:[1],x:'AAAA 记录指向 IPv6 地址；A 记录指向 IPv4 地址，MX 是邮件交换记录。'},
{id:'T46',area:'tech',topic:'计算机网络',level:'进阶',q:'浏览器访问 HTTPS 站点时，哪项校验直接用于确认服务器证书适用于当前访问的域名？',o:['核对证书中的域名标识与访问域名是否匹配','读取页面标题是否相同','检查服务器使用的端口是否为80','确认网页里有登录框'],a:[0],x:'证书的域名标识（如 subjectAltName）须与所访问域名匹配；还须校验证书链、有效期等，页面内容不能替代身份校验。'},
{id:'T47',area:'tech',topic:'计算机网络',level:'进阶',q:'只问地址是否属于 10.0.0.0/24 这个 IPv4 地址块（不问能否分配给主机），哪些地址属于该块？（多选）',o:['10.0.0.0','10.0.0.255','10.0.1.0','10.0.0.42'],a:[0,1,3],x:'/24 固定前三个八位组为 10.0.0，最后一个可为0至255；网络地址和广播地址也属于地址块，但通常不分配给主机。'},
{id:'T48',area:'tech',topic:'计算机网络',level:'进阶',q:'TCP 接收方通过通告接收窗口限制发送方未确认数据量，主要解决哪类问题？',o:['流量控制：避免发送速度超过接收方处理能力','域名解析：查找主机 IP','路由选择：选最短物理线路','磁盘调度：减少寻道'],a:[0],x:'接收窗口用于端到端流量控制；拥塞控制则主要关注网络承载能力，两者侧重点不同。'},
{id:'T49',area:'tech',topic:'计算机组成',level:'基础',q:'指令采用立即寻址时，操作数通常位于哪里？',o:['指令编码本身','DNS 服务器上','另一个进程的栈中','交换机的 MAC 表中'],a:[0],x:'立即寻址的操作数作为指令的一部分给出，通常不需再按操作数地址读取内存。'},
{id:'T50',area:'tech',topic:'计算机组成',level:'基础',q:'基址加偏移量寻址中，若基址寄存器为 0x1000、偏移量为 0x20，有效地址为？',o:['0x1020','0x1000','0x0020','0x2000'],a:[0],x:'有效地址按基址加偏移量计算，即 0x1000 + 0x20 = 0x1020。'},
{id:'T51',area:'tech',topic:'计算机组成',level:'进阶',q:'关于 Cache，哪些说法正确？（多选）',o:['顺序访问相邻数据有利于利用空间局部性','短时间重复访问同一数据有利于利用时间局部性','写回策略下，被修改的缓存行可能在替换时写回下层存储','只要增大 Cache 容量，任意程序的执行时间必然严格缩短'],a:[0,1,2],x:'空间局部性和时间局部性都有助于命中；写回缓存的脏行通常在替换时写回。容量增大不保证任意程序耗时严格下降。'},
{id:'T52',area:'tech',topic:'计算机组成',level:'基础',q:'采用 4 KiB 大小的页时，页内偏移需要多少个二进制位？',o:['10位','12位','16位','20位'],a:[1],x:'4 KiB = 4096 B = 2^12 B，因此地址低12位可表示页内偏移。'},
{id:'T53',area:'tech',topic:'计算机组成',level:'进阶',q:'设 Cache 命中时间为1 ns、未命中率为5%、未命中额外代价为20 ns，采用 AMAT = 命中时间 + 未命中率×额外代价。哪些说法正确？（多选）',o:['按给定公式，平均访问时间为2 ns','在其他参数不变时，未命中率降低会降低 AMAT','平均访问时间必定等于20 ns','未命中率从5%升到10%会使 AMAT 降为1 ns'],a:[0,1],x:'AMAT=1+0.05×20=2 ns；保持命中时间和额外代价不变时，未命中率越低，AMAT 越小。'},
{id:'T54',area:'tech',topic:'计算机组成',level:'进阶',q:'一台按字节编址且采用小端存储的机器，将 32 位数 0x12345678 写入连续4字节内存，最低地址处是什么字节？',o:['0x12','0x34','0x56','0x78'],a:[3],x:'小端存储把最低有效字节放在最低地址；0x12345678 的最低有效字节是 0x78。'},
{id:'T55',area:'tech',topic:'数据结构与算法',level:'基础',q:'检查一段只含小括号的字符串是否匹配，扫描时最适合用哪种结构保存尚未配对的左括号？',o:['栈','最小堆','哈希环','邻接矩阵'],a:[0],x:'括号匹配遵循后进先出，读到左括号入栈，读到右括号与栈顶左括号配对。'},
{id:'T56',area:'tech',topic:'数据结构与算法',level:'进阶',q:'在通常实现下，哪些排序可保持相等关键字元素原有的相对顺序？（多选）',o:['插入排序：仅在前一个元素严格大于当前元素时右移','归并排序：遇到相等关键字时优先取左半部分','堆排序：按普通二叉堆交换元素','快速排序：按普通原地交换分区'],a:[0,1],x:'所述插入排序和归并排序对相等元素不改变先后顺序，具备稳定性；普通堆排序和原地快速排序通常不稳定。'},
{id:'T57',area:'tech',topic:'数据结构与算法',level:'基础',q:'最大堆中，根节点的关键字与堆内其他节点相比有什么性质？',o:['不小于任何其他节点','必定是第二小','必定不大于叶节点','与其他节点无序且不可判断'],a:[0],x:'最大堆每个父节点的键值不小于子节点，因此根节点为堆中最大值之一。'},
{id:'T58',area:'tech',topic:'数据结构与算法',level:'进阶',q:'需要动态合并若干集合，并多次判断两个元素是否属于同一集合，优先使用哪种结构？',o:['并查集','单调队列','字符数组排序','最短路径树'],a:[0],x:'并查集提供合并（union）和查找代表元（find），可用于动态连通性判断。'},
{id:'T59',area:'tech',topic:'数据结构与算法',level:'进阶',q:'对有 V 个顶点、E 条边且采用邻接表表示的图，哪些说法正确？（多选）',o:['从一个起点执行 BFS 的时间复杂度为 O(V+E)','从一个起点执行 DFS 的时间复杂度为 O(V+E)','BFS 能直接求任意非负加权图的最小总权值路径','DFS 总能按边数从少到多访问所有顶点'],a:[0,1],x:'邻接表上的 BFS、DFS 每个顶点和边至多按常数次处理，耗时 O(V+E)；普通 BFS 只保证无权图最少边数，不保证加权最小权值。'},
{id:'T60',area:'tech',topic:'数据结构与算法',level:'基础',q:'用循环只保存相邻两项来求第 n 个斐波那契数（不考虑大整数运算成本），额外空间复杂度是多少？',o:['O(1)','O(log n)','O(n)','O(n²)'],a:[0],x:'只保留前两项和临时结果，辅助变量个数不随 n 增长，因此额外空间为 O(1)。'},
{id:'T61',area:'tech',topic:'Java与C/C++',level:'基础',q:'Java 中声明 int a = 1000, b = 1000; 时，表达式 a == b 的结果是什么？',o:['true，因为比较的是两个 int 的数值','false，因为比较的是两个对象地址','编译报错，因为 int 不可比较','只在字符串池开启时为 true'],a:[0],x:'a 和 b 都是基本类型 int，== 比较数值；对象引用的 == 才比较是否指向同一对象。'},
{id:'T62',area:'tech',topic:'Java与C/C++',level:'进阶',q:'关于 Java 常见类型，哪些说法正确？（多选）',o:['String 对象的字符内容创建后不能原地修改','List<String> 的泛型约束可在编译期检查加入的元素类型','HashMap 允许多线程不加同步地安全并发写入','使用 new 打开文件后，Java 会保证资源在当前作用域退出时立刻自动关闭'],a:[0,1],x:'String 不可变，泛型提供编译期类型检查；HashMap 不能直接视为线程安全容器，资源需显式关闭或用 try-with-resources。'},
{id:'T63',area:'tech',topic:'Java与C/C++',level:'基础',q:'Java 的 try-with-resources 主要用于自动关闭哪类对象？',o:['实现 AutoCloseable 接口的资源','任意局部基本类型变量','所有静态字段','未实现关闭接口的任意对象'],a:[0],x:'try-with-resources 会在退出语句块时调用所声明资源的 close()，资源须实现 AutoCloseable。'},
{id:'T64',area:'tech',topic:'Java与C/C++',level:'进阶',q:'关于常见 C++ 内存与容器用法，哪些说法正确？（多选）',o:['std::unique_ptr 可在离开作用域时自动释放其独占管理的对象','std::vector 的元素在内存中连续存放','用 new[] 分配的数组应以 delete[] 释放','sizeof(指针变量) 总能得到它指向的动态数组字节数'],a:[0,1,2],x:'unique_ptr 利用 RAII 管理对象，vector 元素连续；new[] 对应 delete[]。sizeof(指针) 返回指针自身大小，不是动态数组大小。'},
{id:'T65',area:'tech',topic:'Java与C/C++',level:'进阶',q:'C++ 中若可能通过基类指针 delete 实际指向派生类的对象，基类析构函数通常应如何声明？',o:['声明为 virtual','声明为 static','删除基类析构函数','让派生类析构函数私有且不做其他处理'],a:[0],x:'基类析构函数设为 virtual，才能在经基类指针删除派生类对象时正确调用派生类析构链。'},
{id:'T66',area:'tech',topic:'Java与C/C++',level:'进阶',q:'关于 Java 异常类型，哪些说法正确？（多选）',o:['IOException 属于受检异常，通常须捕获或在方法签名中声明','RuntimeException 及其子类属于非受检异常','所有异常都必须在编译期用 catch 捕获','finally 可以替代抛出异常的处理逻辑并保证操作总会成功'],a:[0,1],x:'IOException 是受检异常；RuntimeException 是非受检异常。受检异常可声明抛出而非必须 catch，finally 也不保证操作成功。'},
{id:'T67',area:'tech',topic:'网络安全与密码学',level:'基础',q:'存储用户密码摘要时，为每个用户生成独立随机盐，主要改善什么？',o:['增加跨用户复用预计算哈希表的难度','让密码明文自动恢复','保证用户密码从不被猜中','使哈希函数变成可逆加密'],a:[0],x:'独立随机盐使同密码也产生不同摘要，降低预计算和彩虹表跨账号复用效果；仍需采用适合密码存储的慢哈希算法。'},
{id:'T68',area:'tech',topic:'网络安全与密码学',level:'进阶',q:'验证 HTTPS 服务器证书时，哪些检查与确认目标身份直接相关？（多选）',o:['证书中的域名与实际访问域名匹配','证书链通向客户端信任的根证书且链中签名有效','检查证书是否在有效期内','只要页面有锁形图标就忽略证书验证结果'],a:[0,1,2],x:'域名匹配、有效的信任链和有效期均属证书验证要点；不能用页面图标替代证书校验。'},
{id:'T69',area:'tech',topic:'网络安全与密码学',level:'基础',q:'在常见公钥数字签名方案中，接收方通常使用签名者的什么来验证签名？',o:['公钥','私钥','对称会话密钥','随机生成的访问口令'],a:[0],x:'签名者用私钥签名，验证方使用与之配对的公钥验证；公钥是否可信还需与身份绑定。'},
{id:'T70',area:'tech',topic:'网络安全与密码学',level:'进阶',q:'双方已安全共享 HMAC 密钥时，关于正确使用 HMAC 的说法有哪些？（多选）',o:['接收方可用同一密钥验证消息是否被改动','接收方可验证消息来自持有该密钥的一方','HMAC 会自动对消息正文保密加密','不共享密钥的第三方可单凭普通哈希冒充有效 HMAC'],a:[0,1],x:'HMAC 以共享密钥提供完整性和基于持钥方的认证，不负责加密保密；无密钥者不能仅靠普通哈希伪造有效 MAC。'},
{id:'T71',area:'tech',topic:'网络安全与密码学',level:'基础',q:'下列哪组登录方式最清晰地结合“所知”与“所有”两类不同认证因素？',o:['密码与硬件安全密钥','两次输入相同密码','用户名与密码','密码与密码提示问题'],a:[0],x:'密码是所知因素，硬件安全密钥是所有因素；重复输入密码或增加知识型问题不构成不同因素组合。'},
{id:'T72',area:'tech',topic:'网络安全与密码学',level:'进阶',q:'针对生产系统账号权限，哪些做法符合最小权限与可追溯目标？（多选）',o:['仅授予履职所需权限并定期复核','离岗或角色变更后及时回收不再需要的权限','记录特权操作审计日志并保护日志完整性','多人共用一个管理员账号以简化管理'],a:[0,1,2],x:'按需授权、及时回收、保护审计记录有助于降低滥权风险并追溯操作；共用账号会削弱责任归属。'},
{id:'T73',area:'tech',topic:'机器学习',level:'基础',q:'在训练、验证、测试三份数据中，通常用哪一份选择模型超参数而把另一份留作最终泛化评估？',o:['验证集选超参数，测试集做最终评估','测试集选超参数，训练集做最终评估','测试集同时反复调参与最终评估','训练集完全不参与模型拟合'],a:[0],x:'训练集拟合参数，验证集比较与调节超参数，测试集尽量保留到最终独立评估，避免测试信息泄漏。'},
{id:'T74',area:'tech',topic:'机器学习',level:'进阶',q:'训练误差明显低于验证误差时，哪些做法可能有助于缓解过拟合且不泄漏验证信息？（多选）',o:['在训练数据上增加适当正则化','适当降低模型复杂度，并仅用训练集拟合模型参数','先用包含验证集的全部样本拟合标准化参数再宣称验证集独立','反复直接对验证集标签做梯度更新'],a:[0,1],x:'适当正则化和控制模型复杂度有助于泛化；预处理或梯度更新若使用验证集信息，会破坏独立验证。'},
{id:'T75',area:'tech',topic:'机器学习',level:'基础',q:'二分类中，精确率 Precision 的定义是什么？',o:['TP/(TP+FP)','TP/(TP+FN)','TN/(TN+FP)','(TP+TN)/样本总数'],a:[0],x:'精确率衡量预测为正的样本中真正为正的比例，即 TP/(TP+FP)；召回率才是 TP/(TP+FN)。'},
{id:'T76',area:'tech',topic:'机器学习',level:'进阶',q:'面对正类仅占1%的分类任务，哪些评估或处理说法正确？（多选）',o:['只预测负类仍可能得到很高的总体准确率','应结合业务目标关注正类召回率、精确率等指标','若采用过采样，应仅在训练数据内部进行而不改变独立测试集','准确率达到99%就必定能检出至少一个正类'],a:[0,1,2],x:'极度类不平衡时全预测负类可有99%准确率但召回为0；需结合精确率/召回率，过采样仅用于训练数据以防评估失真。'},
{id:'T77',area:'tech',topic:'机器学习',level:'基础',q:'在线性模型训练中加入 L2 正则项，通常直接鼓励什么？',o:['权重不要过大','所有权重必须精确等于0','训练样本数量自动增加','测试集标签自动生成'],a:[0],x:'L2 正则对较大权重施加惩罚，通常使参数收缩；不强制每个权重精确归零。'},
{id:'T78',area:'tech',topic:'机器学习',level:'进阶',q:'对有监督学习做 K 折交叉验证时，哪些说法正确？（多选）',o:['每轮用其中一折作验证集，其余折作训练集','标准 K 折会让每折轮流承担一次验证角色','先用所有折拟合特征标准化器再交叉验证可避免数据泄漏','交叉验证分数越高，就无需保留独立测试集'],a:[0,1],x:'标准 K 折轮换验证折；标准化等有学习参数的预处理须在每轮训练折内拟合，独立测试集仍可用于最终评估。'},
{id:'T79',area:'tech',topic:'软件测试与工程',level:'基础',q:'某输入只接受闭区间 [1,100] 内整数，哪组选值最适合同时测试下界、上界及紧邻的越界点？',o:['0、1、100、101','1、50、100、200','10、20、30、40','2、50、99、100'],a:[0],x:'0/1 是下界外侧与边界，100/101 是上界与外侧，符合边界值测试。'},
{id:'T80',area:'tech',topic:'软件测试与工程',level:'基础',q:'关于测试层次，哪些说法正确？（多选）',o:['单元测试通常验证较小的代码单元','集成测试关注组件之间协作与接口','单元测试通过就能证明系统不存在并发问题','性能压测只检查按钮文案是否正确'],a:[0,1],x:'单元测试着眼小单元，集成测试覆盖组件协作；单元测试不能证明全系统无并发问题，性能压测关注负载下表现。'},
{id:'T81',area:'tech',topic:'软件测试与工程',level:'进阶',q:'某项目语句覆盖率达到100%，对测试结论应如何表述？',o:['至少每条可达语句执行过，但仍可能存在未覆盖的分支或缺陷','所有可能输入都已测试','所有分支都执行过且系统没有缺陷','无需再做边界值测试'],a:[0],x:'语句覆盖只表明语句被执行，不等于分支覆盖、条件组合覆盖或无缺陷证明。'},
{id:'T82',area:'tech',topic:'软件测试与工程',level:'进阶',q:'下列哪些是依据输入或需求外部行为设计的典型黑盒测试方法？（多选）',o:['等价类划分','边界值分析','依据源码统计分支覆盖','依据源码统计语句覆盖'],a:[0,1],x:'等价类和边界值从输入输出规格设计用例；分支、语句覆盖依赖内部代码结构，属于白盒视角。'},
{id:'T83',area:'tech',topic:'软件测试与工程',level:'基础',q:'持续集成 CI 中，每次合并代码前自动构建并运行测试的主要价值是什么？',o:['尽早发现集成引入的构建或回归问题','保证任何需求都永不变更','替代所有人工验收和安全审查','跳过版本管理直接改生产文件'],a:[0],x:'自动构建和测试可及时反馈集成或回归问题，但不能代替人工验收、安全审查等环节。'},
{id:'T84',area:'tech',topic:'软件测试与工程',level:'进阶',q:'为降低应用版本发布失败时的回滚风险，哪些做法通常合理？（多选）',o:['保留已验证可用的上一版本制品','评估数据库变更对旧版应用的兼容性','因自动测试通过而跳过所有发布前审批','直接在生产环境手工修改代码且不留记录'],a:[0,1],x:'可用的旧制品及回滚路径需要提前准备；数据库变更若与旧版不兼容，回退应用仍可能失败。审批和变更记录不能直接省略。'},
{id:'T85',area:'tech',topic:'运维与可靠性',level:'基础',q:'在给定统计窗口的请求时延样本中，P99 时延为800 ms 通常表示什么？',o:['约99%的请求时延不超过800 ms','所有请求时延都恰好是800 ms','平均时延一定为800 ms','至少99%的请求时延超过800 ms'],a:[0],x:'P99 是第99百分位时延，约99%的观测请求不超过该值；它不等于均值，也不保证所有请求都在阈值内。'},
{id:'T86',area:'tech',topic:'运维与可靠性',level:'进阶',q:'排查线上接口响应变慢且报错增多，哪些监控信息有助于定位问题？（多选）',o:['请求延迟分布及错误率趋势','主机或容器 CPU、内存、连接等资源饱和情况','经过脱敏和权限控制的关联日志与链路追踪','仅凭一次成功请求就断定整体服务健康'],a:[0,1,2],x:'时延、错误和资源饱和度可反映症状，关联日志/追踪有助于定位调用链；单次成功不足以证明整体健康。'},
{id:'T87',area:'tech',topic:'运维与可靠性',level:'基础',q:'滚动发布多实例服务时，比较稳妥的做法是什么？',o:['分批替换实例，逐批通过健康检查后继续','同时停掉全部实例再开始部署','不做探活，单靠进程存在判断业务成功','直接删除旧版制品，防止回滚'],a:[0],x:'滚动发布按批替换并结合健康检查，有利于维持可用性和及时发现异常；仍应预留回滚能力。'},
{id:'T88',area:'tech',topic:'运维与可靠性',level:'进阶',q:'关于容灾指标 RTO 与 RPO，哪些说法正确？（多选）',o:['RTO 描述故障后恢复服务的目标时长','RPO 描述可接受的数据丢失时间窗口目标','RTO 为10分钟表示每10分钟必须做一次备份','RPO 为0就能单独保证故障后立即恢复服务'],a:[0,1],x:'RTO 关注恢复服务耗时，RPO 关注恢复点与可丢失数据窗口；备份频率及服务恢复速度不能从另一指标单独推出。'},
{id:'T89',area:'tech',topic:'运维与可靠性',level:'基础',q:'在常见 Linux 系统中，想快速查看各文件系统的可用磁盘空间，优先使用哪个命令？',o:['df -h','ps -ef','ping localhost','chmod 600'],a:[0],x:'df -h 按易读单位展示文件系统容量与可用空间；ps 查看进程，ping 测试网络连通性。'},
{id:'T90',area:'tech',topic:'运维与可靠性',level:'进阶',q:'为降低误删数据并同步复制到从库后的恢复风险，哪些备份策略合理？（多选）',o:['定期演练从备份恢复并校验数据可用性','在与在线主从复制故障域隔离的位置保留备份','认为有主从实时复制就不再需要独立备份','只检查备份任务返回成功，不验证备份能否恢复'],a:[0,1],x:'误删可能通过复制同步到从库；独立隔离的备份与定期恢复演练能提升真实可恢复性，仅有复制或备份成功提示不足够。'},
{id:'T91',area:'tech',topic:'操作系统',level:'进阶',q:'低优先级线程持有互斥锁，高优先级线程等待该锁，多个中优先级线程持续抢占低优先级线程。采用优先级继承主要缓解什么问题？',o:['缺页异常','优先级反转','磁盘坏道','地址空间碎片'],a:[1],x:'高优先级线程被低优先级持锁者阻塞，而中优先级线程又阻碍持锁者运行，形成优先级反转；优先级继承临时提高持锁者优先级，使其尽快运行并释放锁，并非改变内存或磁盘机制。'},
{id:'T92',area:'tech',topic:'操作系统',level:'进阶',q:'在支持写时复制的系统中，进程调用 fork 后、任一方写入共享页面前，哪些说法通常正确？（多选）',o:['父子进程可暂时引用相同的物理数据页','fork 不必立即复制全部可共享数据页','子进程写入共享页面后必然同时改动父进程所见内容','写入共享页面时可触发复制，以维持父子进程各自的地址空间语义'],a:[0,1,3],x:'写时复制允许父子进程先共享标记为写保护的物理页，避免 fork 时立即复制全部数据；一方写入时再建立私有副本，因此正常的私有页面写入不会同时改动另一方所见内容。'},
{id:'T93',area:'tech',topic:'操作系统',level:'基础',q:'用户态程序要读取磁盘文件，通常通过系统调用请求操作系统内核提供服务。系统调用的关键作用是什么？',o:['直接赋予用户程序永久内核权限','通过受控入口切换到内核态执行受保护操作','把磁盘数据自动转换为 SQL 表','确保每次磁盘读取都命中缓存'],a:[1],x:'系统调用是用户态请求内核服务的受控入口；内核检查参数和权限后执行受保护操作，再返回用户态。它既不授予程序永久特权，也不保证缓存命中。'},
{id:'T94',area:'tech',topic:'操作系统',level:'进阶',q:'线程以互斥锁保护共享队列，并用条件变量等待队列非空。哪些用法正确？（多选）',o:['等待操作应在挂起线程时原子地释放关联互斥锁','被唤醒并重新持锁后仍应循环检查队列非空条件','收到一次通知就能保证队列中一定还有元素可取','生产者修改队列状态后通知等待者，等待者再按条件判断'],a:[0,1,3],x:'条件变量等待会原子释放锁并在返回前重新获得锁，使生产者有机会改变状态；被唤醒可能因虚假唤醒或其他消费者先取走元素，必须在循环中复查谓词。通知只提示状态可能变化，不能替代条件判断。'},
{id:'T95',area:'tech',topic:'操作系统',level:'进阶',q:'页框数增加后，某页置换策略的缺页次数反而可能增加。这种现象经典地可出现在下列哪种策略中？',o:['始终不置换任何页面','只读页表映射','先进先出 FIFO','理想最优置换策略'],a:[2],x:'Belady 异常指增加页框数却发生更多缺页，经典 FIFO 在特定引用串上可能出现；最优置换具有栈性质，不会因可用页框增加而使缺页次数变多。'},
{id:'T96',area:'tech',topic:'数据库事务与SQL',level:'进阶',q:'事务甲先后两次按同一主键读取同一行，期间事务乙修改该行并提交，甲两次读到不同值。这一现象最准确叫什么？',o:['脏读','幻读','不可重复读','死锁'],a:[2],x:'甲读取的是乙已提交的修改，因此不是读取未提交值的脏读；同一行重复读取结果改变称为不可重复读。幻读通常涉及相同条件查询得到的行集合发生变化。'},
{id:'T97',area:'tech',topic:'数据库事务与SQL',level:'进阶',q:'设某数据库事务按固定快照读取已提交数据，且本事务自己的写入对自身可见；不考虑特殊锁定读。哪些结论成立？（多选）',o:['其他事务在快照建立之后提交的版本通常不会进入该固定快照','本事务能看到自己在该事务内已完成的写入','固定快照意味着可以立即清理所有仍被活跃事务引用的旧版本','清理旧版本时需要考虑仍在使用旧快照的活跃事务'],a:[0,1,3],x:'题设固定快照确定了对其他事务提交版本的可见边界，同时明确本事务可读自己的写入；旧版本可能仍被活跃事务的快照引用，不能不加检查地全部清理。具体实现可有差异，结论仅基于题设。'},
{id:'T98',area:'tech',topic:'数据库事务与SQL',level:'基础',q:'对空结果集执行 SELECT SUM(amount) 得到 NULL。若业务页面需要显示数值 0，应在 SQL 中如何处理？',o:['把 SUM(amount) 改为 COUNT(*)','使用 COALESCE(SUM(amount), 0)','在 WHERE 中加入 amount = NULL','用 ORDER BY amount 替代聚合'],a:[1],x:'SUM 在没有可求和的非 NULL 值时结果为 NULL；COALESCE 取第一个非 NULL 参数，可将该结果转为 0。COUNT(*) 计数而非汇总金额，普通等号也不能正确判断 NULL。'},
{id:'T99',area:'tech',topic:'数据库事务与SQL',level:'进阶',q:'查询要保留左表全部用户，只连接右表中状态为成功的记录。对于 LEFT JOIN，哪些说法正确？（多选）',o:['把右表状态条件写在 ON 中，仍可保留没有成功记录的左表用户','将右表状态条件写在 WHERE 中，仍必然保留所有未匹配的左表用户','在 WHERE 中要求右表状态等于成功，会过滤掉右侧为 NULL 的未匹配行','ON 与 WHERE 的右表过滤条件对 LEFT JOIN 的保留行效果总是相同'],a:[0,2],x:'ON 中的右表条件限制可连接的记录，未找到时 LEFT JOIN 仍产生左表行和右侧 NULL；若在 WHERE 要求右侧状态等于成功，未匹配行的比较结果不为真，会被过滤。因此两处条件的语义不同。'},
{id:'T100',area:'tech',topic:'数据库事务与SQL',level:'进阶',q:'表 events 有 user_id、created_at、唯一 id；要为每位用户选出时间最新的一行，时间并列时取 id 最大的一行。哪种窗口函数排序符合要求？',o:['ROW_NUMBER() OVER (ORDER BY user_id ASC)','RANK() OVER (PARTITION BY user_id ORDER BY created_at ASC)','COUNT(*) OVER (PARTITION BY created_at)','ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC, id DESC)'],a:[3],x:'按 user_id 分区才能分别为每位用户编号；created_at 降序令最新记录排前，唯一 id 降序解决时间并列，再筛选行号为 1 即得到每组唯一一行。其余写法缺分区、方向错误或不是排名。'},
{id:'T101',area:'tech',topic:'数据库事务与SQL',level:'进阶',q:'账户表对单行执行原子 UPDATE：余额减100、版本号加1，WHERE 限定账户号、旧版本号与余额不少于100；以受影响行数判定结果。哪些说法正确？（多选）',o:['版本号匹配失败时，这条 UPDATE 不会修改该账户行','受影响行数为1表示此语句按给定条件更新了该行','两次并发请求带相同旧版本号就必定都更新成功','受影响行数为0时，应重新读取状态再决定是否重试或返回失败'],a:[0,1,3],x:'版本号与余额条件在同一条原子更新语句中判断；某次成功更新版本后，持旧版本的竞争语句不再匹配。行数为1表明该语句成功更新，行数为0可能因余额不足或版本过期，需要按最新状态处理，不能盲目判定原因。'},
{id:'T102',area:'tech',topic:'数据库事务与SQL',level:'进阶',q:'事务甲两次执行相同的范围查询，事务乙在两次查询之间插入一行符合该范围的数据并提交；若甲第二次看见新增行，这叫什么现象？',o:['写偏斜','幻读','脏写','丢失更新'],a:[1],x:'同一谓词范围查询第二次出现新行，属于幻读；它关注满足条件的行集合变化，而非同一行被改写后的不可重复读。题干明确甲确实看到了乙已提交的新增行。'},
{id:'T103',area:'tech',topic:'分布式一致性与消息队列',level:'进阶',q:'某复制组有5个节点，每次操作要求得到其中至少3个节点确认。仅就集合交集而言，哪些说法正确？（多选）',o:['任意两个各含3个节点的确认集合至少重叠1个节点','只得到1个节点确认就满足多数派条件','两个均达到多数派的确认集合不可能完全不相交','只要确认集合有交集，就可省略协议中的任期或版本校验'],a:[0,2],x:'两个大小至少为3的集合若完全不相交，总节点数至少为6，与只有5个节点矛盾，故至少交叠1个；交集只是多数派协议的结构基础，不足以替代任期、日志顺序或版本等安全校验。'},
{id:'T104',area:'tech',topic:'分布式一致性与消息队列',level:'进阶',q:'网络分区期间，跨分区消息完全无法到达。若要求对同一数据的读写保持线性一致，不能让分区两侧都无条件成功响应请求，主要是因为什么？',o:['DNS 不支持多个节点','每个节点都必须永久停机','两侧无法协调最新状态，均承诺成功可能违背单一全局顺序','消息队列无法存储二进制数据'],a:[2],x:'分区切断协调路径时，两侧若都接受互相冲突的读写并承诺立即成功，可能无法形成符合实时先后关系的线性一致历史；要维持线性一致，某些请求可能必须等待或失败。此处不把单纯有响应与成功响应混同。'},
{id:'T105',area:'tech',topic:'分布式一致性与消息队列',level:'进阶',q:'消息系统采用至少一次投递：消费者业务处理成功后才确认消息；若确认丢失可能重新投递。哪些做法或判断正确？（多选）',o:['同一业务消息可能被消费者处理流程看到多次','用稳定的业务请求标识配合持久化去重，可降低重复副作用风险','处理成功后发出确认就绝不可能再收到该消息','先提交业务结果再确认消息时，要设计确认丢失后的重复处理'],a:[0,1,3],x:'处理成功但确认未被代理接收时，代理仍可能重新投递；因此至少一次不等于恰好一次。基于业务标识做持久化幂等处理，并考虑业务提交与确认之间的失败窗口，才能控制重复扣款等副作用。'},
{id:'T106',area:'tech',topic:'分布式一致性与消息队列',level:'进阶',q:'某消息队列只保证单分区内按写入顺序读取。若同一账户事件需要保持顺序，最直接的分区策略是哪种？',o:['每条事件随机选择分区','按账户号稳定映射到同一分区','把同一账户的事件轮流写入所有分区','按事件内容长度选择分区'],a:[1],x:'用账户号作为稳定分区键，使同一账户的事件进入同一分区，才能利用题设的分区内顺序保证；跨分区不承诺全局顺序。消费者若并行处理同一分区，仍需避免应用侧打乱处理顺序。'},
{id:'T107',area:'tech',topic:'分布式一致性与消息队列',level:'进阶',q:'用事务出站表模式将本地数据库状态变更与待发事件关联，哪些描述正确？（多选）',o:['业务数据变更和出站记录可在同一本地数据库事务中提交','独立投递进程可随后读取出站记录并发送事件','只要用了出站表，远端消费者就不可能重复收到事件','投递进程崩溃后重试可能重复发出事件，消费者仍应考虑幂等'],a:[0,1,3],x:'本地事务可原子地提交业务数据与事件记录，避免业务提交成功却完全没有待发记录；异步投递解决跨系统传送，但发送成功后未记录完成等故障窗口仍可能导致重复消息，远端必须处理重复。'},
{id:'T108',area:'tech',topic:'分布式一致性与消息队列',level:'进阶',q:'跨多个服务的 Saga 已完成前两步，第三步失败。关于补偿操作，哪项最准确？',o:['补偿必然在物理上抹除全部历史记录','补偿可无视外部可见的业务后果','补偿是按业务语义执行的反向处理，未必等同数据库回滚','Saga 意味着所有步骤在一个数据库事务中提交'],a:[2],x:'Saga 用各步骤的本地事务和失败后的业务补偿协调长流程；补偿可能是退款、解除预留等新业务动作，而不是把所有服务已提交的事务物理回滚。外部已观察到的效果也未必能完全消除。'},
{id:'T109',area:'tech',topic:'分布式一致性与消息队列',level:'进阶',q:'对最终一致的副本系统，假设停止新写入且网络随后恢复、同步消息最终均可送达。哪些说法合理？（多选）',o:['网络分区或同步延迟期间，不同副本读到的数据可能暂时不同','在题设的收敛条件下，各副本最终可达到一致状态','最终一致保证每次写入成功后所有副本立刻返回新值','客户端若需要读己之写，通常还须额外设计相应的会话或读路由机制'],a:[0,1,3],x:'最终一致允许传播期间的临时差异；题设停止写入且同步可达，系统有条件逐渐收敛。它本身不保证写后所有副本立即可见，也不自动提供读己之写，后者需另行设计。'},
{id:'T110',area:'tech',topic:'计算机网络与云计算',level:'基础',q:'域名的解析记录已修改，但部分客户端仍获得旧地址。仅考虑正常的 DNS 缓存行为，最直接的解释是什么？',o:['TCP 会永久锁定旧域名','中间或本地缓存的旧记录在 TTL 到期前仍可被使用','HTTPS 证书会自动改写所有缓存','路由器必须先清空数据库事务'],a:[1],x:'递归解析器或本地缓存可在旧记录允许的生存时间 TTL 内继续使用旧结果；新记录发布不等于所有缓存立即失效。实际生效还取决于缓存策略，TTL 不是全球同步切换的精确时刻。'},
{id:'T111',area:'tech',topic:'计算机网络与云计算',level:'进阶',q:'按照 HTTP 方法语义讨论同一请求的重复执行，哪些说法正确？（多选）',o:['GET 设计为安全方法，客户端不应依赖它执行状态变更','PUT 使用相同请求体将同一目标资源设为相同状态，设计上具有幂等语义','POST 按协议语义总是天然幂等，无需业务层去重','幂等不意味着服务器日志等所有副作用在重复请求后完全相同'],a:[0,1,3],x:'GET 的安全语义面向读取，PUT 对同一目标重复应用相同表示具有相同预期资源效果；POST 不自动保证幂等，必要时需业务请求键。幂等关注请求预期效果，重复请求仍可能各自产生日志等附带记录。'},
{id:'T112',area:'tech',topic:'计算机网络与云计算',level:'基础',q:'负载均衡器发现某后端实例健康检查持续失败，通常应首先如何处理对该实例的新请求？',o:['从可选后端中暂时摘除该实例并继续探测恢复情况','将所有新请求强制发往该实例','删除其他正常实例','只修改客户端时区而不调整路由'],a:[0],x:'健康检查失败说明实例可能无法正常服务，应暂时停止向它分配新请求，避免扩大失败；后续继续探测，可在确认恢复后重新纳入。已建立连接及具体故障转移细节依实现而定。'},
{id:'T113',area:'tech',topic:'计算机网络与云计算',level:'基础',q:'开发者部署代码到托管运行平台，由平台负责操作系统和运行环境的常规维护，而开发者仍负责应用代码。该模式更接近什么？',o:['纯自建物理机托管','只租裸磁盘','平台即服务 PaaS','离线磁带备份'],a:[2],x:'PaaS 提供托管运行环境，平台负责底层系统和运行时的较多运维工作，开发者主要负责应用及其配置；IaaS 通常还需要租户自行管理虚拟机中的操作系统与运行环境。责任边界仍以实际服务约定为准。'},
{id:'T114',area:'tech',topic:'计算机网络与云计算',level:'进阶',q:'多实例水平扩展一个无状态 HTTP 服务，哪些设计有助于任意实例接手后续请求？（多选）',o:['不把唯一会话状态只保存在某一实例内存中','把必要的共享状态放入可访问的持久化或共享存储','要求用户后续请求永远只能路由到首次访问的实例','为多实例部署设计统一的配置与服务发现机制'],a:[0,1,3],x:'无状态服务的单次请求不依赖某台实例私有的会话记忆；必要状态外置、实例使用一致的配置和服务发现，才更容易让负载均衡将请求交给任意健康实例。永久绑定单实例会削弱该能力。'},
{id:'T115',area:'tech',topic:'安全与密码学',level:'进阶',q:'使用 AES-GCM 加密多条消息时，对于同一把密钥下的 nonce，哪项要求最关键？',o:['所有消息都使用全零 nonce','同一密钥下不得重复使用同一个 nonce','nonce 必须等于消息明文','只要消息长度不同就允许 nonce 重复'],a:[1],x:'GCM 属于带认证的加密模式，同一密钥下重复 nonce 会破坏安全假设，可能泄露信息并影响认证安全；应按方案生成足够可靠的唯一 nonce，不能依赖消息长度区分。'},
{id:'T116',area:'tech',topic:'安全与密码学',level:'进阶',q:'为用户密码生成不可逆校验值，哪些做法比直接使用快速通用哈希更合适？（多选）',o:['使用针对密码存储设计的 KDF，并设置合理计算成本','为便于找回密码而原样存储明文','使用可调成本的密码哈希机制，增加离线批量猜测代价','只做一次快速哈希即可保证弱密码无法被猜中'],a:[0,2],x:'密码存储宜使用 Argon2id、scrypt 或 bcrypt 等专门的密码 KDF，结合适当成本参数与独立盐以提高离线猜测代价；明文存储会直接暴露密码，快速哈希也不能弥补弱口令问题。'},
{id:'T117',area:'tech',topic:'安全与密码学',level:'进阶',q:'接口请求已使用消息认证码保护内容完整性，但攻击者可原样重放抓到的合法请求。以下哪种附加设计最直接针对重放？',o:['取消服务端所有请求日志','仅提高响应页面字体大小','只把请求字段顺序调换','将唯一请求标识与有效时间纳入认证内容，并由服务端校验时间及标识是否已使用'],a:[3],x:'合法请求的原样重放仍会通过消息认证码校验；将唯一标识和时间约束纳入受认证数据，并在服务端持久记录或按有效窗口检查已使用标识，才能识别重复请求。单靠完整性校验不提供新鲜性。'},
{id:'T118',area:'tech',topic:'安全与密码学',level:'基础',q:'网页把用户填写的备注作为 HTML 内容直接拼入其他用户可见的页面，主要应采用什么措施降低脚本注入风险？',o:['按 HTML 输出上下文对不可信内容正确转义，必要时用安全模板接口','仅把数据库查询改为按时间排序','关闭服务器磁盘缓存','仅在页面底部声明备注不可信'],a:[0],x:'未经处理地将不可信文本作为 HTML 解释可能导致跨站脚本执行；在输出位置按具体上下文编码，或使用会将文本安全插入 DOM 的接口，能阻止文本被当作脚本或标签。SQL 参数化解决的是另一类注入风险。'},
{id:'T119',area:'tech',topic:'安全与密码学',level:'进阶',q:'向指定接收者传输大文件，采用混合加密：随机生成会话密钥，用对称算法加密文件，再用接收者公钥封装会话密钥。哪些说法正确？（多选）',o:['文件主体可由对称会话密钥高效加密','接收者可用自己的私钥解封装供自己使用的会话密钥','只有对称加密与密钥封装就自动证明发送者身份','仍须采用认证加密或其他完整性保护以检测密文被篡改'],a:[0,1,3],x:'对称加密处理大量数据，公钥机制用于安全传递会话密钥；接收者用配对私钥解封装。仅保证密钥送达指定接收者并不自动证明发送者身份；若需抵御篡改，还须使用正确的认证加密及相关校验。'},
{id:'T120',area:'tech',topic:'算法与数据结构',level:'基础',q:'任务依赖关系构成有向图。若要排出满足全部先后依赖的执行次序，且某个子图存在有向环，会发生什么？',o:['环上任务自动按编号升序执行','仍必定存在合法拓扑序','包含有向环的图不存在覆盖全部顶点的拓扑序','只需把图改成无向图即可保留原依赖'],a:[2],x:'拓扑序要求每条有向边的起点排在终点前；有向环会要求环上某任务既先于又晚于自身，产生矛盾。因此覆盖全部顶点的合法拓扑序仅对有向无环图存在。'},
{id:'T121',area:'tech',topic:'算法与数据结构',level:'进阶',q:'对固定数组 [3, -2, 5, 4] 构建前缀和 P，令 P[0]=0、P[k] 为前 k 项之和。哪些说法正确？（多选）',o:['下标从0起，区间 [1,3] 的和等于 P[4]-P[1]','构建后可用两次前缀和读取在 O(1) 时间求任意连续区间和','若原数组某一项改变，原有全部前缀和都仍然有效','该数组的 P[4] 为10，区间 [1,3] 的和为7'],a:[0,1,3],x:'P 依次为 [0,3,1,6,10]；区间 [l,r] 和为 P[r+1]-P[l]，所以 [1,3] 为10-3=7，静态查询为 O(1)。若原数组值改变，受影响的后续前缀和须更新，不能直接沿用。'},
{id:'T122',area:'tech',topic:'算法与数据结构',level:'进阶',q:'从左到右扫描数组，为每个元素找右侧第一个严格更大的元素。使用保存尚未找到答案的下标的单调栈，整体时间复杂度通常是多少？',o:['O(1)','O(n)','O(n²) 必然如此','O(2^n)'],a:[1],x:'每个下标最多入栈一次、在遇到更大元素时最多出栈一次；即使一次扫描弹出多个下标，全部入栈与出栈次数合计仍为 O(n)，得到均摊线性时间。'},
{id:'T123',area:'tech',topic:'算法与数据结构',level:'进阶',q:'数据流有大量数字，仅需维护目前最大的 k 个数，且 k 远小于总数。应优先维护哪种结构？',o:['容量等于总数据量的邻接矩阵','只保存目前最小值的变量','至多 k 个元素的小根堆','每来一个数都重排全部已收到数据'],a:[2],x:'小根堆保存当前最大的 k 个数，堆顶是入选集合的最小值；新数若不超过堆顶可丢弃，否则替换堆顶并调整堆，额外空间 O(k)、每次调整 O(log k)。'},
{id:'T124',area:'tech',topic:'算法与数据结构',level:'进阶',q:'用一维数组实现每件物品最多选一次的 0/1 背包，处理一件重量 w、价值 v 的物品。哪些说法正确？（多选）',o:['容量 c 从大到小更新，有助于避免同一物品在本轮被反复使用','在 c>=w 时，可尝试令 dp[c]=max(dp[c], dp[c-w]+v)','在同一数组上无条件从小到大更新，仍必然满足每件最多选一次','0/1 背包与物品可无限重复选的完全背包具有不同的容量更新方向'],a:[0,1,3],x:'容量倒序时，计算 dp[c] 所读到的 dp[c-w] 尚未被当前物品更新，因而当前物品只使用一次；正序原地更新可能再次利用本轮结果，相当于重复选用。状态转移在容量足够时取不选或选一次的较大值。'},
{id:'T125',area:'tech',topic:'Java/C++/Python',level:'进阶',q:'Java 中多个线程共享 volatile int count，并分别执行 count++。对此最准确的说法是什么？',o:['volatile 有助于可见性，但 count++ 是读改写组合，不因此成为原子操作','volatile 能保证所有自增操作没有丢失更新','volatile 会把 count 自动变为不可变对象','count++ 只需要进行一次不可分割的机器操作'],a:[0],x:'volatile 建立规定的可见性与有序性语义，但 count++ 包含读、加、写等步骤；线程交错仍可能把两次自增写成一次结果。若需原子计数，可使用 AtomicInteger 等原子类或适当同步。'},
{id:'T126',area:'tech',topic:'Java/C++/Python',level:'进阶',q:'Java 自定义对象作为 HashMap 键时，关于 equals 与 hashCode，哪些说法正确？（多选）',o:['两个对象若按 equals 相等，其 hashCode 必须相等','不同对象的 hashCode 相等，不代表 equals 必定相等','覆写 equals 后可以随意让相等对象返回不同的 hashCode','作为键参与比较的字段若可变且被修改，可能造成后续查找异常'],a:[0,1,3],x:'HashMap 先用哈希值定位桶，再在候选键间比较相等性；相等对象须有相同哈希值，但哈希碰撞允许不相等对象哈希相同。键的哈希或相等性相关字段入表后改变，会破坏按原位置查找的前提。'},
{id:'T127',area:'tech',topic:'Java/C++/Python',level:'进阶',q:'在 C++ 中，std::unique_ptr 不可复制，但可以转移所管理对象的独占所有权。下列哪种操作最符合这一语义？',o:['直接复制 unique_ptr，让两个指针共同独占对象','通过 std::move 将所有权转交给另一个 unique_ptr','用 memcpy 复制 unique_ptr 内存以共享对象','把 unique_ptr 赋值给自己并假设自动深拷贝对象'],a:[1],x:'unique_ptr 禁止复制以维持唯一所有权，使用 std::move 可调用移动操作，将所有权转给目标指针，源指针随后不再拥有该对象。按字节复制或假定深拷贝都会破坏所有权语义。'},
{id:'T128',area:'tech',topic:'Java/C++/Python',level:'进阶',q:'Python 函数定义为 def add(x, items=[]): items.append(x); return items。依次调用 add(1)、add(2) 且未显式传入 items，第二次返回什么？',o:['[2]','[]','[1, 2]','抛出类型错误'],a:[2],x:'默认参数在函数定义时创建一次；两次未传 items 的调用共享同一个列表，第一次追加 1，第二次在同一列表上追加 2，因此返回 [1, 2]。需隔离调用状态时应以 None 作为默认值并在函数内新建列表。'},
{id:'T129',area:'tech',topic:'Java/C++/Python',level:'进阶',q:'Python 执行 a=[[1],[2]]; b=a.copy(); b[0].append(3)。执行后哪些说法正确？（多选）',o:['a[0] 的内容为 [1,3]','b 与 a 是两个不同的外层列表','a[0] 仍必然为 [1]','若只对 b 的外层列表执行 append，新增加的外层元素不会因此加入 a'],a:[0,1,3],x:'list.copy() 只复制外层列表，两个外层对象不同，但原有嵌套列表元素仍被共享；修改 b[0] 指向的内层列表会反映在 a[0]。只向 b 外层追加新元素则改变 b 的外层结构，不会自动追加到 a。'},
{id:'T130',area:'tech',topic:'软件工程与测试',level:'基础',q:'单元测试要验证计算模块在外部短信服务返回失败时的处理分支，又不希望实际发送短信。优先采用什么方法？',o:['在生产环境反复调用真实短信接口','删除失败分支避免测试','只观察测试运行速度','注入可控的测试替身，模拟短信服务失败并断言模块行为'],a:[3],x:'通过依赖注入使用 mock 或 fake 等测试替身，可稳定制造外部服务失败条件，并检验模块是否执行预期错误处理；既不依赖外部服务可用性，也不会真的给用户发送短信。'},
{id:'T131',area:'tech',topic:'软件工程与测试',level:'进阶',q:'服务消费者与提供方独立发布，使用消费者驱动的契约测试。哪些描述正确？（多选）',o:['消费者可将自身依赖的请求与响应约定表达成契约','提供方可在发布前验证实现仍满足已约定的消费者契约','契约测试通过就能替代全部端到端业务流程测试','契约测试有助于及早发现字段删除或含义变化造成的接口不兼容'],a:[0,1,3],x:'消费者契约描述其依赖的接口行为，提供方据此验证兼容性；它能较早发现接口结构和约定被破坏，却不能覆盖完整的跨系统业务路径、环境配置及所有非功能问题，不能代替全部端到端测试。'},
{id:'T132',area:'tech',topic:'软件工程与测试',level:'进阶',q:'变异测试把代码中的比较运算符做小幅变更，再运行原测试集。若变异后的程序仍通过所有测试，最合理的初步判断是什么？',o:['原程序肯定没有任何缺陷','测试可能未有效区分该行为变化，需检查是否为等价变异体及测试断言','变异后的程序必定比原程序正确','只要语句覆盖率达标即可忽略结果'],a:[1],x:'变异体存活可能表示测试未覆盖该行为或断言不够敏感，也可能因为变异前后对所有相关输入行为等价；应先核查等价性，再考虑补充能揭示差异的测试，不能直接宣称原程序有错或无错。'},
{id:'T133',area:'tech',topic:'软件工程与测试',level:'进阶',q:'为整数排序函数做性质测试，生成多种输入数组。哪些可作为每个输出都应满足的不变量？（多选）',o:['输出序列按非降序排列','输出与输入的元素及各元素出现次数相同','只要随机测试多轮通过，就数学上证明函数对所有输入正确','输出数组的长度与输入相同'],a:[0,1,3],x:'正确的排序应同时满足有序性与元素多重集保持，后者已蕴含长度不变；长度仍可作为直观的辅助断言。随机生成有限组样本有助于发现缺陷，但不能穷尽全部整数数组并构成普遍正确性的证明。'},
{id:'T134',area:'tech',topic:'软件工程与测试',level:'进阶',q:'两个团队独立实现同一格式解析规范，用同一批输入比较两者输出；对这种差分测试的结论，哪项最准确？',o:['只要两个实现结果一致，规范一定被正确实现','只要有一个实现运行快，就无需比较输出','输出不同可提示至少需要核查实现或规范理解，一致也不能单独证明两者都正确','差分测试只能用于测试页面颜色'],a:[2],x:'相同输入产生不同输出说明实现之间存在可观察差异，需要结合规范核查原因；两者输出相同也可能共享同一误解，因此比较结果可定位疑点，但不能单独充当正确性的完整证明。'},
{id:'T135',area:'tech',topic:'数据治理与备份容灾',level:'进阶',q:'建立数据血缘以记录报表指标从源表、加工任务到目标报表的关系，哪些说法正确？（多选）',o:['血缘可辅助评估上游字段变更影响哪些下游指标','血缘可用于追溯某报表字段的来源与加工路径','只要画出血缘图，所有数据质量问题就会自动修复','记录任务依赖与字段映射有助于缩小问题排查范围'],a:[0,1,3],x:'血缘表达数据来源、变换及去向，能支持变更影响分析和问题追溯；若要解决错误值、缺失值等质量问题，还须实际校验、修复与治理，血缘记录本身不会自动修正数据。'},
{id:'T136',area:'tech',topic:'数据治理与备份容灾',level:'基础',q:'一张交易明细表约定业务流水号不得为空且同一批次内不得重复。分别对应哪两类常见数据质量校验？',o:['时效性与精确率','完整性与唯一性','加密性与可用性','吞吐量与缓存命中率'],a:[1],x:'不得为空约束必要字段有值，属于完整性校验；同批次流水号不得重复，属于唯一性校验。该约定限定了唯一性的作用范围为同一批次，不能推断跨批次也唯一。'},
{id:'T137',area:'tech',topic:'数据治理与备份容灾',level:'进阶',q:'某数据接口的旧客户端明确会忽略未知字段，新增字段被定义为可选且缺失时有约定默认值。在这些前提下，哪项版本演进通常最不易破坏旧客户端？',o:['删除所有旧客户端必填字段','把既有字段类型从整数直接改为对象','仅新增这个可选字段并保留既有字段语义','把旧字段名称全部重命名而不提供映射'],a:[2],x:'旧客户端会忽略不认识的新字段，旧请求缺省新字段时也有默认处理；保留旧字段及语义的可选字段新增通常较容易兼容。删除必填项、改类型或无映射重命名都可能让既有消费者解析失败。'},
{id:'T138',area:'tech',topic:'数据治理与备份容灾',level:'进阶',q:'约定差异备份记录上次完整备份以来的全部变化，增量备份记录上次任意备份以来的变化。哪些说法正确？（多选）',o:['恢复到某次差异备份对应的状态，通常需要上次完整备份和该次差异备份','恢复到某次增量备份对应的状态，需要按依赖顺序还原基线完整备份及后续所需的差异、增量备份','差异备份只保存上次差异备份之后的变化','若多次差异备份都基于同一次完整备份，后一次通常覆盖的累计变化范围不小于前一次'],a:[0,1,3],x:'差异备份的基准始终是同一次完整备份，所以恢复通常用完整备份加目标差异备份；增量备份依赖前一次任意备份，恢复时须按依赖顺序应用基线及所需差异、增量备份，不能跳过中间依赖。若期间出现数据删除，差异备份仍须准确表达自基准以来的变化，而不只是新增加的文件。'},
{id:'T139',area:'tech',topic:'数据治理与备份容灾',level:'进阶',q:'数据库已具备可恢复的完整备份和连续归档的事务日志。若要恢复到某次误操作发生前的指定时刻，最直接依赖什么能力？',o:['只看运行中主从复制延迟','只保留最新一次全量文件而丢弃日志','按时间点恢复：从备份起重放日志至目标时刻前的有效事务','直接把当前数据库文件复制回当前实例'],a:[2],x:'按时间点恢复通常先还原可用的基线备份，再依赖连续且可用的事务日志重放到目标时刻或目标事务边界；只有全量备份无法精确定位备份之后、误操作之前的状态。具体切点与提交边界须按数据库机制确认。'},
{id:'T140',area:'tech',topic:'数据治理与备份容灾',level:'进阶',q:'设计加密备份的实际恢复流程时，哪些检查或准备合理？（多选）',o:['确认恢复所需的密钥材料可在受控条件下取得','核对备份与日志链覆盖目标恢复点且文件完整','认为只要备份文件存在，就无需考虑应用与外部系统的数据一致性','在恢复后核查业务约束及与相关系统的对账结果'],a:[0,1,3],x:'加密备份没有可用密钥就无法解密；缺失文件或日志链断裂也会使目标恢复点不可达。恢复数据库文件后，还应核查业务约束以及与外部系统的交互状态，避免把技术层成功等同于业务层一致。'},
{id:'C01',area:'coding',topic:'字符串',level:'基础',q:'仿编练习：若按字符集合替换规则，将第一串“banana”中所有也出现在第二串“an”的字符替换为“*”，结果是？',o:['b*****','b*n*n*','banana','**n*n*'],a:[0],x:'a 和 n 都在第二串中，第一串中除 b 外所有字符都替换，得 b*****。'},
{id:'C02',area:'coding',topic:'字符串',level:'基础',q:'仿编练习：判断一个字符串能否重排为“31415”，最稳妥的必要且充分条件是？',o:['长度为5即可','含有3和4即可','每种字符计数与“31415”完全相同','只检查首尾字符'],a:[2],x:'目标字符频次：1有2个，3/4/5各1个；频次全相等才可重排。'},
{id:'C03',area:'coding',topic:'链表',level:'进阶',q:'仿编练习：链表为 1→2→3→4，先把第二个节点的值复制到末尾，再删除原链表前三个节点，得到什么？',o:['4→2','2→4','3→4→2','4'],a:[0],x:'复制值2到尾部得 1→2→3→4→2；删前三个后是 4→2。这里明确只执行一轮。'},
{id:'C04',area:'coding',topic:'排序与边界',level:'基础',q:'仿编练习：把数字字符“0、3、4、5”各用一次，组成不以0开头的最小四位正整数，结果是？',o:['0345','3045','3405','3450'],a:[1],x:'最小的非零位3作首位，其余升序0、4、5，得到3045。'},
{id:'C05',area:'coding',topic:'状态机',level:'进阶',q:'仿编练习：从字符串开头截取最长、由非负整数和 +、− 组成的算式；禁止前导零或末尾运算符。对“12+03-4”，最长合法前缀是？',o:['12','12+0','12+03','12+03-4'],a:[1],x:'“12+0”合法；接下来的3会让数字段变为“03”，出现前导零，因此无法继续。规则是本模拟题明确给定的，不代表原题所有细节。'},
{id:'C06',area:'coding',topic:'图论',level:'进阶',q:'仿编练习：无权无向图中，需要反复求一个起点到所有点的最少边数，应优先选用？',o:['广度优先搜索','冒泡排序','并查集只看连通性','线性查找'],a:[0],x:'无权图单源最短边数用BFS，复杂度 O(V+E)。'},
{id:'C07',area:'coding',topic:'数论',level:'进阶',q:'仿编练习：容量为4和6的两个水桶，可装满、倒空、互倒直到一方空或满。问水量和能否达到5？',o:['一定能','不能，因为5不是gcd(4,6)的倍数','只要总容量大于5就一定能','容量相加为偶数因此能'],a:[1],x:'可达水量变化均为 gcd(4,6)=2 的倍数，奇数5不可达。'},
{id:'C08',area:'coding',topic:'组合计数',level:'进阶',q:'仿编练习：把“rrreedd”重排成不同字符串，计数时需要防止什么重复？',o:['同一字符彼此交换形成的重复排列','不同字符交换形成的不同排列','总字符个数','子串长度'],a:[0],x:'相同字符不可区分，直接枚举7!个下标排列会重复，需按字符频次去重。'},
{id:'C09',area:'coding',topic:'动态规划',level:'进阶',q:'仿编练习：每个 a[i] 可变为 a[i]−1、a[i] 或 a[i]+1，要求相邻结果不相等、总费用最低。动态规划状态最适合记录？',o:['当前位选择的偏移和截至此位的最小费用','整个数组的所有排列','仅最后一位原值','只记录总元素和'],a:[0],x:'对每位的−1/0/+1三种选择维护最小费用；转移时要求它与前一位最终值不同。'},
{id:'C10',area:'coding',topic:'字符串',level:'进阶',q:'仿编练习：在字符串“rxeyd”中，字符 r、e、d 保持顺序但不要求连续，这种匹配关系称为什么？',o:['前缀','子串','子序列','回文'],a:[2],x:'不要求连续、只要求相对顺序一致的是子序列；连续才是子串。'},
{id:'C11',area:'coding',topic:'数学思维',level:'基础',q:'仿编练习：对整数14反复拆成向下与向上取半，只统计能出现的不同正整数（含14），依次能得到多少种？',o:['5','6','7','14'],a:[1],x:'不同值为14、7、3、4、2、1，共6种。题意按本模拟规则明确为“不同正整数”。'},
{id:'C12',area:'coding',topic:'数组',level:'基础',q:'仿编练习：按十进制数字逐个翻转规则，数字 120 与 40 翻转后应分别得到？',o:['21 与 4','021 与 04','120 与 40','12 与 4'],a:[0],x:'逐位倒序后再按整数解释，120→021→21，40→04→4；前导零不保留。'},
{id:'C13',area:'coding',topic:'字符串',level:'基础',q:'模拟题：从左到右读入 abbaca，每当相邻两个相同字符出现就一起消去，继续处理剩余字符，最终得到什么？',o:['abca','baca','ca','空串'],a:[2],x:'用栈依次处理：两个 b 消去后两侧的 a 相邻并消去，余下 c、a，结果为 ca。'},
{id:'C14',area:'coding',topic:'字符串边界',level:'基础',q:'模拟题：在空文本中查找非空模式串 abc，约定只计完整匹配的起始位置。匹配次数是多少？',o:['0','1','3','无法确定'],a:[0],x:'文本长度 0 小于模式长度 3，不存在能容纳完整模式的起点，因此为 0。'},
{id:'C15',area:'coding',topic:'双桶与gcd',level:'进阶',q:'模拟题：容量分别为9升、15升的水桶可装满、倒空、互倒至一方空或满。若要让某个桶恰有6升，哪项判断正确？',o:['可行，因为 gcd(9,15)=3 整除6，且15升桶倒入9升桶后剩6升','不可行，因为6小于9','不可行，因为容量都不是6的倍数','可行只需两桶都倒空'],a:[0],x:'gcd(9,15)=3，6是其倍数且不超过较大容量；装满15升桶，向9升桶倒至其满，原桶剩6升。'},
{id:'C16',area:'coding',topic:'双桶状态',level:'基础',q:'模拟题：两桶容量分别为5升和3升，初态(0,0)。依次“装满5升桶→向3升桶倒至满→倒空3升桶→把5升桶剩余水全倒入3升桶”，末态(5升桶,3升桶)是？',o:['(0,2)','(2,0)','(2,3)','(0,3)'],a:[0],x:'状态依次为(5,0)→(2,3)→(2,0)→(0,2)，所以末态为(0,2)。'},
{id:'C17',area:'coding',topic:'链表',level:'进阶',q:'模拟题：只允许通过 next 指针访问单链表，需用 O(1) 额外空间判断是否有环，应选哪种方法？',o:['快慢指针：每轮分别走两步和一步，观察是否相遇','把所有节点放进哈希集合','先对节点的值排序','仅比较头尾节点的值'],a:[0],x:'Floyd 快慢指针若有环终会在环内相遇，无环时快指针到达末尾；只占常数额外空间。哈希集合需 O(n) 空间。'},
{id:'C18',area:'coding',topic:'链表边界',level:'进阶',q:'模拟题：非空单链表至少有两个节点，只给尾节点的引用，不给头指针或前驱；要删除尾节点并保持其余链表正确连接，哪项正确？',o:['复制下一节点的值即可 O(1) 删除','仅凭尾节点引用无法找到前驱并修改其 next','将尾节点 next 设为 null 就完成删除','交换尾节点与头节点的值即可'],a:[1],x:'尾节点没有下一节点可复制；删除需要把前驱的 next 改为 null，而单凭尾节点引用无法沿单链表逆向找到前驱。'},
{id:'C19',area:'coding',topic:'链表操作',level:'基础',q:'模拟题：单链表 1→2→3→4→5，仅将第2至第4个节点（含两端）原地反转，结果是？',o:['1→4→3→2→5','4→3→2→1→5','1→2→4→3→5','5→4→3→2→1'],a:[0],x:'待反转片段为 2→3→4，反转后接回原头节点1和原尾节点5，得到 1→4→3→2→5。'},
{id:'C20',area:'coding',topic:'最短路选型',level:'进阶',q:'模拟题：有向图边权只可能为0或1，要求单源最短距离且希望 O(V+E) 时间。应优先采用？',o:['普通 BFS 忽略边权','0-1 BFS，用双端队列分别从队首/队尾加入边权0/1的松弛结果','仅做一次深度优先遍历','并查集'],a:[1],x:'0-1 BFS 对权0的松弛放队首、权1放队尾，可按距离顺序处理，复杂度 O(V+E)；普通 BFS 只适合等权边。'},
{id:'C21',area:'coding',topic:'最短路手算',level:'基础',q:'模拟题：有向边 A→B(4)、A→C(1)、C→B(2)、B→D(1)、C→D(7)，A 到 D 的最短距离是？',o:['3','4','5','8'],a:[1],x:'走 A→C→B→D 的权重为1+2+1=4；A→B→D 为5，A→C→D 为8，因此最短为4。'},
{id:'C22',area:'coding',topic:'最短路选型',level:'进阶',q:'模拟题：有向图允许负权边、保证没有从源点可达的负环，求单源最短路，应从下列方法中选哪一个？',o:['普通 BFS','标准 Dijkstra','Bellman-Ford','并查集'],a:[2],x:'Bellman-Ford 对边重复松弛，最多 V−1 轮即可得到无可达负环时的最短路；标准 Dijkstra 不适用于一般负权边。'},
{id:'C23',area:'coding',topic:'最短路边界',level:'基础',q:'模拟题：无权图只有 A—B 和 C—D 两条边；约定起点不可达终点时返回 -1。A 到 D 的最短边数应返回？',o:['0','1','2','-1'],a:[3],x:'A 所在连通分量只有 A、B，无法到 D；按题设不可达哨兵值返回 -1，而非距离0。'},
{id:'C24',area:'coding',topic:'枚举去重',level:'基础',q:'模拟题：数组 [1,1,2] 的不同子集有多少个？空集也计入，元素相同的子集只算一次。',o:['4','5','6','8'],a:[2],x:'数字1可选0、1、2个，数字2可选0、1个，独立组合共3×2=6个不同子集；不能把两个1当成不同元素计数。'},
{id:'C25',area:'coding',topic:'枚举去重',level:'基础',q:'模拟题：从 [1,1,2,2,3,4] 中选两个不同下标的元素，使和为5；只统计不同的无序数值对，结果有几对？',o:['1','2','3','4'],a:[1],x:'满足条件的无序数值对只有(1,4)、(2,3)两种；重复的1或2不会制造新数值对。'},
{id:'C26',area:'coding',topic:'枚举算法',level:'进阶',q:'模拟题：从 n 个整数找所有和为0的不同三元数值组，希望 O(n²) 级别枚举并避免重复，哪种方案合适？',o:['先排序，固定一个数，再双指针找另外两个并跳过重复值','三层循环枚举下标而不去重','只检查相邻三个元素','仅用并查集合并相同值'],a:[0],x:'排序后每次固定首元素，余下区间左右指针按和移动；固定值及指针命中后跳过重复值，时间 O(n²)。'},
{id:'C27',area:'coding',topic:'子串',level:'基础',q:'模拟题：字符串 pwwkew 的最长“字符互不重复的连续子串”长度是？',o:['2','3','4','5'],a:[1],x:'连续窗口 wke 或 kew 长度为3；跨过重复的 w 拼出更长的非连续字符序列不算子串。'},
