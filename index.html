{id:'C28',area:'coding',topic:'子序列计数',level:'进阶',q:'模拟题：按下标选择且保持顺序，babgbag 中能选出多少个子序列 bag？不同下标选法分别计数。',o:['3','4','5','6'],a:[2],x:'依次枚举 b：首个 b 可接第一个 a 后的两个 g，或第二个 a 后的一个 g，共3种；后两个 b 各只能接第二个 a 和末尾 g，各1种，总数5。'},
{id:'C29',area:'coding',topic:'子串与子序列边界',level:'基础',q:'模拟题：本题约定长度为0的连续片段也算子串，不选字符也算子序列。空串与非空字符串 xyz 的关系是什么？',o:['空串是其子串，也是其子序列','空串仅是其子串','空串仅是其子序列','空串两者都不是'],a:[0],x:'子串允许取长度为0的连续片段，子序列允许不选任何字符；所以空串同时满足两种定义。'},
{id:'C30',area:'coding',topic:'动态规划手算',level:'基础',q:'模拟题：硬币面值1、3、4均可无限使用，凑出总额6的最少硬币数是多少？',o:['1','2','3','4'],a:[1],x:'3+3 只用2枚；没有面值6的硬币故不可能只用1枚，最优为2。贪心取4再取两个1反而需要3枚。'},
{id:'C31',area:'coding',topic:'动态规划手算',level:'基础',q:'模拟题：一次可走1级或2级台阶，走完恰好5级共有几种不同的步长序列？',o:['5','6','8','10'],a:[2],x:'设 f(0)=1、f(1)=1，末步为1或2，故 f(n)=f(n−1)+f(n−2)；依次得 f(2)=2、f(3)=3、f(4)=5、f(5)=8。'},
{id:'C32',area:'coding',topic:'动态规划手算',level:'基础',q:'模拟题：序列 [3,1,2,5,4] 的严格递增子序列最长长度是多少？元素可不连续。',o:['2','3','4','5'],a:[1],x:'例如 1,2,5 或 1,2,4 均长3；3后只能接5或4，且2后不能同时依次接5和4，因此不存在长度4的严格递增子序列。'},
{id:'C33',area:'coding',topic:'动态规划选型',level:'进阶',q:'模拟题：每件物品有重量和价值，每件至多取一次，在容量上限内最大化总价值，最贴切的算法模型是？',o:['完全背包','0/1 背包动态规划','无权图 BFS','仅按价值从大到小贪心'],a:[1],x:'“至多取一次”对应每件选或不选的0/1背包；完全背包允许重复取同一件，单纯贪心不保证最优。'},
{id:'C34',area:'coding',topic:'复杂度',level:'进阶',q:'模拟题：n≥2 时，外层 i 从1开始每轮乘2，条件 i<n；每轮内层执行恰好 i 次常数操作。总时间复杂度为？',o:['O(log n)','O(n)','O(n log n)','O(n²)'],a:[1],x:'各轮工作量为1+2+4+…，最大一项小于 n，几何级数总和小于2n且与 n 同阶，故为 O(n)。'},
{id:'C35',area:'coding',topic:'复杂度选型',level:'进阶',q:'模拟题：n≥2，先用归并排序对 n 个整数排序，再对排序结果做 m 次独立的二分查找；忽略读入时间，最坏总时间复杂度是？',o:['O(n+m)','O(n log n+m log n)','O(nm)','O(log n+log m)'],a:[1],x:'归并排序最坏为 O(n log n)，每次二分 O(log n)，m 次共 O(m log n)，相加得到 O(n log n+m log n)。'},
{id:'C36',area:'coding',topic:'滑动窗口边界',level:'基础',q:'模拟题：给定正整数数组，找和至少为7的最短连续子数组长度；约定不存在时返回0。输入为空数组 [] 时返回？',o:['0','1','7','-1'],a:[0],x:'空数组没有非空连续子数组，更没有满足和至少为7的候选；依题设不存在时返回0。'},
{id:'C37',area:'coding',topic:'图论选型',level:'进阶',q:'模拟题：无权图中有多个补给站，要求每个顶点到最近补给站的最少边数，应如何一次性计算？',o:['每个顶点各做一次 DFS','将所有补给站以距离0同时入队，做多源 BFS','只从编号最小的补给站 BFS','先对顶点编号排序'],a:[1],x:'多源 BFS 把所有源点距离设0并同时入队，逐层扩展第一次到达即为到任一源点的最少边数，耗时 O(V+E)。'},
{id:'C38',area:'coding',topic:'双桶边界',level:'进阶',q:'模拟题：容量为2升和3升的桶可装满、倒空、互倒，问能否让两桶内的水量之和恰好为6升？',o:['能，因为 gcd(2,3)=1','能，因为两桶容量相邻','不能，因为水量和最多为5升','不能，因为6是偶数'],a:[2],x:'无论如何操作，两桶实际水量之和都不超过2+3=5升；gcd 整除仅是数论条件，不能忽略总容量上界。'},
{id:'C39',area:'coding',topic:'动态规划手算',level:'进阶',q:'模拟题：允许单字符插入、删除、替换，每次成本1；把 kitten 变成 sitting 的最少操作次数是？',o:['1','2','3','4'],a:[2],x:'一种3步方案：k→s 得 sitten，e→i 得 sittin，末尾插入 g 得 sitting；编辑距离动态规划对前缀取插入、删除、替换的最小值，终点为3。'},
{id:'C40',area:'coding',topic:'子序列去重',level:'基础',q:'模拟题：字符串 aaa 有多少种不同的非空子序列字符串？按生成后的字符串去重，不按选取下标计数。',o:['3','4','7','8'],a:[0],x:'可能的非空结果只有 a、aa、aaa，共3种；尽管单个 a 有多个选法，结果相同应合并。'},
{id:'C41',area:'coding',topic:'双指针选型',level:'进阶',q:'模拟题：判断字符串能否通过“至多删除一个字符”成为回文，线性时间且常数额外空间的正确策略是？',o:['按字典序排序再比较两端','双指针向中间走，首个不相等处分别尝试跳过左字符或右字符，检查余下区间','遇到首个不相等处同时跳过两端','只比较首尾两个字符'],a:[1],x:'匹配时收缩两端；首次失配时唯一可能的删除对象是这两个端点之一，分别检查剩余片段是否回文即可，整体 O(n)、额外 O(1)。'},
{id:'C42',area:'coding',topic:'图遍历复杂度',level:'进阶',q:'模拟题：用邻接表表示含 V 个顶点、E 条边的无向图；对每个未访问顶点启动一次 BFS，以遍历所有连通分量，整体时间复杂度是？',o:['O(1)','O(log V)','O(V+E)','O(VE)'],a:[2],x:'外层检查每个顶点一次，各顶点至多入队一次；遍历所有邻接表的边记录总量为2E，因此总体 O(V+E)，孤立点也计入 V。'},
{id:'C43',area:'coding',topic:'字符串手算',level:'基础',q:'模拟题：对字符串 ababaca 计算 KMP 前缀函数 pi，pi[i] 是以 i 结尾的前缀中最长真前后缀的长度；下标从0开始。整个 pi 数组是？',o:['[0,0,1,2,3,0,1]','[0,0,1,2,3,2,1]','[0,1,2,3,4,0,1]','[0,0,1,2,3,0,0]'],a:[0],x:'依次看各前缀：前两位无匹配，aba、abab、ababa 的最长真前后缀长1、2、3；遇 c 退至0，末尾 a 又匹配首字符，故为 [0,0,1,2,3,0,1]。'},
{id:'C44',area:'coding',topic:'字符串选型',level:'进阶',q:'模拟题：文本长 n、非空模式长 m，1≤m≤n≤10^6；要找出所有模式出现位置（允许重叠），期望 O(n+m) 时间，应选？',o:['每个起点都从头比对，最坏 O(nm)','KMP：先求模式前缀函数，再扫描文本并在失配时回退','先按字符频次相同就视为匹配','对文本排序后直接二分查找原位置'],a:[1],x:'模式预处理 O(m)，扫描时用前缀函数复用已匹配信息，失配不回退文本指针；命中后按前缀函数继续可保留重叠匹配，总计 O(n+m)。'},
{id:'C45',area:'coding',topic:'栈手算',level:'基础',q:'模拟题：空格分隔的后缀表达式 5 1 2 + 4 * + 3 -，运算符弹出的先后两数按“次栈顶 运算符 栈顶”计算，结果是？',o:['11','14','17','20'],a:[1],x:'1 2 + 得3，3 4 * 得12，5 12 + 得17，最后17 3 - 得14；后缀表达式按顺序用栈归约。'},
{id:'C46',area:'coding',topic:'单调栈选型',level:'进阶',q:'模拟题：数组长 1≤n≤10^5，求每个元素右侧第一个“严格大于”它的值，找不到记 -1；要求 O(n) 时间，应选？',o:['对每个位置向右线性扫描','从右向左维护单调栈，弹出小于等于当前值的元素，栈顶即答案','对原数组整体排序后取相邻值','只记录右侧最大值'],a:[1],x:'逆向扫描时，小于等于当前值的栈元素不可能成为当前或更左位置的首个严格更大值，可弹出；保留栈顶是最近的合格值，每个元素至多入栈、出栈一次，O(n)。'},
{id:'C47',area:'coding',topic:'链表手算',level:'基础',q:'模拟题：两个非降序单链表分别为 1→4→6 和 2→3→5；依次比较表头并将较小节点接入结果，最终链表是？',o:['1→2→3→4→5→6','1→4→6→2→3→5','2→1→3→5→4→6','1→2→4→3→5→6'],a:[0],x:'依次选择当前两表头中的较小值：1、2、3、4、5；第二表耗尽后接上剩余的6，得到 1→2→3→4→5→6。'},
{id:'C48',area:'coding',topic:'链表选型',level:'进阶',q:'模拟题：单链表长 n，1≤k≤n；仅用一次从头到尾的遍历和 O(1) 额外空间找倒数第 k 个节点，应该怎么做？',o:['快指针先走 k 步，再让快慢指针同速前进至快指针为 null，返回慢指针','把所有节点存进数组再倒着取','快慢指针始终相邻，最后返回快指针','只从头节点走 k 步'],a:[0],x:'快指针领先 k 个节点；同时前进保持间距不变。快指针越过尾节点时，慢指针到尾部还差 k−1 步，正是倒数第 k 个；只需 O(n) 时间和 O(1) 空间。'},
{id:'C49',area:'coding',topic:'数组手算',level:'基础',q:'模拟题：将长度5的数组 [7,1,4,9,2] 循环右移2位（移出右端的元素依原顺序回到左端），结果是？',o:['[4,9,2,7,1]','[9,2,7,1,4]','[2,9,7,1,4]','[1,4,9,2,7]'],a:[1],x:'右端最后两项依次是9、2，整体移到左端并保持次序，其余7、1、4跟在后面，得到 [9,2,7,1,4]。'},
{id:'C50',area:'coding',topic:'数组选型',level:'进阶',q:'模拟题：初始长度 n 的整数数组全为0；m 次操作分别将闭区间 [l,r]（1≤l≤r≤n）每项加 d，只在全部操作完成后输出最终数组；如何做到 O(n+m)？',o:['每次逐项修改区间，总是 O(n+m)','用差分数组记录 l 处加 d、r+1 处减 d，最后求一次前缀和','只给首尾元素加 d','排序所有 d 就能直接得到结果'],a:[1],x:'在长度 n+2 的差分数组中对每次操作执行 D[l]+=d、D[r+1]-=d；最终从1到 n 累加差分还原每项。每次更新 O(1)，还原 O(n)，合计 O(n+m)。'},
{id:'C51',area:'coding',topic:'前缀和手算',level:'基础',q:'模拟题：数组 [2,-1,3,0,-2] 按1开始编号，闭区间第2到第4项的和是多少？',o:['1','2','3','4'],a:[1],x:'该区间是 -1、3、0，直接相加为2；若前缀和 P[0]=0，则 P[4]-P[1]=4-2=2。'},
{id:'C52',area:'coding',topic:'前缀和选型',level:'进阶',q:'模拟题：数组长 1≤n≤10^5，元素可正可负也可为0；统计和恰为 k 的非空连续子数组个数，希望期望 O(n) 时间，应选？',o:['只用双指针收缩正数窗口','扫描前缀和，先查此前出现过多少次“当前前缀和−k”，再记录当前前缀和的频次','先排序数组再用二分查找','只看每个元素是否等于 k'],a:[1],x:'子数组 [l,r] 的和等于 P[r]-P[l-1]；先令空前缀0的频次为1，遍历每个新前缀时先计数旧前缀 P-k，再加入当前前缀，确保只计非空区间；哈希表使期望总时间 O(n)。'},
{id:'C53',area:'coding',topic:'动态规划手算',level:'基础',q:'模拟题：3×3 方格从左上到右下，只能向右或向下走；正中央 (2,2) 不可进入，其他格均可走。不同路径有几条？',o:['1','2','4','6'],a:[1],x:'避开中心后只剩先沿上边走到底再沿右边下行的 RRDD，或先沿左边下行再沿下边右行的 DDRR；其余路径会进 (2,2)，共2条。'},
{id:'C54',area:'coding',topic:'动态规划选型',level:'进阶',q:'模拟题：给两个长度分别为 n、m 的字符串，求最长公共“连续子串”的长度（允许答案0），要求 O(nm) 时间；选哪种转移？',o:['字符相同则 dp[i][j]=dp[i-1][j-1]+1，否则置0，并取所有状态最大值','字符不同时取 dp[i-1][j] 与 dp[i][j-1] 的最大值作为当前子串长度','只比较两个串的第一个字符','把两个串排序后比较相邻字符'],a:[0],x:'dp[i][j] 记录恰以两串当前位置结尾的公共连续后缀长；相同才可从左上角延伸1，否则连续性被打断须归零。枚举全部 nm 个位置取最大值。'},
{id:'C55',area:'coding',topic:'图遍历手算',level:'基础',q:'模拟题：有向边 A→B、A→C、B→D、C→D、D→E；从 A 做递归 DFS，按字母序访问邻接点，首次到达就输出。输出顺序是？',o:['A,B,C,D,E','A,B,D,E,C','A,C,D,E,B','A,B,C,E,D'],a:[1],x:'从 A 先到 B，再沿 B→D→E 深入，回溯到 A 后访问未到过的 C；C→D 指向已访问节点，不再输出，次序为 A,B,D,E,C。'},
{id:'C56',area:'coding',topic:'图遍历选型',level:'进阶',q:'模拟题：邻接表存储的有向图有 V 个顶点、E 条边；要在 O(V+E) 时间内判断是否存在有向环，应选？',o:['DFS 使用未访问、递归路径中、已完成三种状态，碰到路径中节点即有环','只数边是否多于 V','只对顶点编号排序','用无向图的普通连通分量数直接判断'],a:[0],x:'DFS 进入节点时标记在当前递归路径，退出时标记完成；边指向当前路径上的节点构成回边和有向环，指向已完成节点不构成该证据。各点边检查常数次，总 O(V+E)。'},
{id:'C57',area:'coding',topic:'二分手算',level:'基础',q:'模拟题：非降序数组 [1,2,2,2,5,8] 下标从0开始；lower_bound(2) 定义为第一个大于等于2的位置。返回的下标是？',o:['0','1','2','4'],a:[1],x:'下标0处是1，不满足大于等于2；下标1处是2，第一次满足，虽然下标2、3也是2，但 lower_bound 返回最左位置1。'},
{id:'C58',area:'coding',topic:'二分选型',level:'进阶',q:'模拟题：0≤i<n（1≤n≤10^6）上的布尔判定先全 false 后全 true；要找首个 true 的下标，若不存在则返回 n，应使用？',o:['维护半开区间 [l,r)，初始 [0,n)，按 mid 判定保留可能含首个 true 的一半，最后返回 l','遇到首个 false 就返回其下标','对下标随机抽样直到碰到 true','把布尔结果按原下标倒序后取末位'],a:[0],x:'保持左侧已排除区间为 false，mid 为 true 时令 r=mid，否则 l=mid+1；当 l=r 返回 l。全 false 时一路推进到 n，全 true 时收缩到0，查询次数 O(log n)。'},
{id:'C59',area:'coding',topic:'字符串手算',level:'基础',q:'模拟题：行程长度编码把每段连续相同字符写成“字符+次数”，次数为1也必须写；输入 aaabbc，输出是？',o:['a3b2c1','a3b2c','a2b2c1','a3b1c2'],a:[0],x:'从左往右分成 aaa、bb、c 三个连续段，长度分别为3、2、1；逐段写出 a3、b2、c1，连接为 a3b2c1。'},
{id:'C60',area:'coding',topic:'栈选型',level:'基础',q:'模拟题：输入只含 ()[]{} 三类括号，长度 0≤n≤10^5；空串算合法，要求线性时间判断括号是否正确嵌套，应选？',o:['按开括号入栈，闭括号到来时检查非空且类型匹配并弹栈，末尾要求栈空','只检查三类括号各自总数相等','排序后比较开闭括号数量','只比较首字符和末字符'],a:[0],x:'栈顶记录最近尚未匹配的开括号；遇闭括号若栈空或类型不同立即失败，处理完还须栈空。空串直接满足，整个扫描 O(n)、额外空间 O(n)。'},
{id:'C61',area:'coding',topic:'数组手算',level:'进阶',q:'模拟题：柱高 [0,1,0,2,1,0,1,3]，每根柱宽1；两侧较高柱围住的积水按每位置 min(左侧最高,右侧最高)-本柱高度（负值记0）计算，总积水量是？',o:['3','4','5','6'],a:[2],x:'只有下标2、4、5、6（从0起）有水，分别为1、1、2、1单位；其余位置为0，相加得到5。'},
{id:'C62',area:'coding',topic:'数组选型',level:'进阶',q:'模拟题：整数数组长 n，1≤k≤n≤10^5，元素可为负；求长度恰为 k 的连续子数组最大和，要求 O(n) 时间、O(1) 额外空间，应选？',o:['每个起点重新累计 k 项','先算前 k 项之和，随后每次减去移出的元素并加上新进入的元素，持续更新最大值','把原数组排序后取最大的 k 个数','仅使用非负元素扩张的可变长窗口'],a:[1],x:'固定长窗口平移一步只交换一出一入两项，窗口和可 O(1) 更新；初始和及所有 n-k 次平移共 O(n)。负数也不影响等式，始终比较长度恰为 k 的窗口。'},
{id:'C63',area:'coding',topic:'动态规划手算',level:'基础',q:'模拟题：线性排列的收益为 [2,7,9,3,1]，不能选相邻位置，允许不选；最大收益是多少？',o:['10','11','12','14'],a:[2],x:'设前 i 位最优为 f(i)，则 f(i)=max(f(i-1),f(i-2)+当前收益)；依次得到2、7、11、11、12。选第1、3、5位即2+9+1=12。'},
{id:'C64',area:'coding',topic:'动态规划选型',level:'进阶',q:'模拟题：m×n 非负代价网格（m,n≥1），从左上到右下只能向右或向下，起点终点也计代价；求最小路径代价，应选？',o:['每个格代价加上来自上方或左方的较小累计代价，边界只取可达前驱','每步总选右和下两个邻格中代价较小的一个','对所有格按代价排序后取最小 m+n-1 个','只用终点格的代价'],a:[0],x:'到达每个格的最后一步只能来自上或左；其最优代价等于本格代价加两条合法前驱路径的最小值。按行计算依赖已知，时间 O(mn)，滚动数组可用 O(n) 空间。'},
{id:'C65',area:'coding',topic:'图遍历手算',level:'基础',q:'模拟题：有向无环图有四个顶点 A、B、C、D，边仅有 A→C、B→C、C→D；每个点恰输出一次，满足所有边先后约束的拓扑序共有几种？',o:['1','2','3','4'],a:[1],x:'A 和 B 均须在 C 前，C 又须在 D 前；前两位可以是 A,B 或 B,A，后两位只能 C,D，故恰有2种。'},
{id:'C66',area:'coding',topic:'图遍历选型',level:'进阶',q:'模拟题：V 个任务、E 条有向依赖边组成 DAG，每条 u→v 表示 u 必须先于 v；要求 O(V+E) 输出一种合法任务顺序，应选？',o:['统计入度，把入度0的任务入队，每输出一个就删除其出边并更新后继入度','按任务名称字典序排序即可','只用无向连通分量','对原依赖边按权值排序'],a:[0],x:'DAG 总存在入度0的未完成点；输出它并删除出边后，剩余图仍为 DAG，重复即可得到满足所有先后约束的拓扑序。每个点边处理常数次，总 O(V+E)。'},
{id:'C67',area:'coding',topic:'二分手算',level:'基础',q:'模拟题：对非负整数 x=26，返回最大的非负整数 r，满足 r×r≤x。返回值是？',o:['4','5','6','13'],a:[1],x:'5×5=25≤26，而6×6=36>26；故满足条件的最大整数为5。'},
{id:'C68',area:'coding',topic:'二分选型',level:'进阶',q:'模拟题：长度 1≤n≤10^5 的严格递增数组循环旋转若干位，元素互不相同；求最小值，要求 O(log n) 时间，应选？',o:['二分比较中点与右端：若中点大于右端，则最小值在右半，否则在含中点的左半','每轮固定丢弃右半，不检查元素','先完整排序再取首元素','只比较原数组前两项'],a:[0],x:'唯一最小值是旋转断点；当 nums[mid]>nums[right] 时断点必在 mid 右侧，否则断点在 [left,mid]。每次至少舍弃一半候选，最后 left=right 指向最小值，O(log n)。'},
{id:'C69',area:'coding',topic:'前缀和手算',level:'基础',q:'模拟题：3×3 矩阵按行是 [1,2,3]、[4,5,6]、[7,8,9]；行列均从1起，闭矩形第2至3行、第2至3列的元素和是？',o:['24','26','28','30'],a:[2],x:'所取四格是5、6、8、9，和为28；用二维前缀和也可算 S[3][3]-S[1][3]-S[3][1]+S[1][1]=45-6-12+1=28。'},
{id:'C70',area:'coding',topic:'前缀和选型',level:'进阶',q:'模拟题：固定 R×C 整数矩阵，之后有 Q 次任意闭矩形求和且没有更新；希望预处理 O(RC)、每次查询 O(1)，应选？',o:['构建二维前缀和，查询时用右下减去上边和左边，再加回重复减掉的左上角','每次遍历查询矩形所有元素','只维护每一行的最大值','先把矩阵元素全局排序'],a:[0],x:'定义 S[i][j] 为前 i 行前 j 列之和，行0或列0为0；闭矩形 (r1,c1) 到 (r2,c2) 的和为 S[r2][c2]-S[r1-1][c2]-S[r2][c1-1]+S[r1-1][c1-1]。建表 O(RC)，每问 O(1)。'},
{id:'C71',area:'coding',topic:'复杂度手算',level:'基础',q:'模拟题：整数 n 初值为64；执行 while(n>1){n=Math.floor(n/2); count++;}，count 初值0。循环结束 count 是？',o:['5','6','7','64'],a:[1],x:'每轮 n 依次变为32、16、8、4、2、1，共执行6次；到1时条件 n>1 为假，故 count=6。'},
{id:'C72',area:'coding',topic:'边界条件选型',level:'进阶',q:'模拟题：长度 0≤n≤10^5 的整数数组可含负数；连续子数组允许为空且空数组的和定义为0。求最大连续子数组和，要求 O(n) 时间、O(1) 额外空间，应选？',o:['初始 cur=best=0，逐个处理 v：cur=max(0,cur+v)，best=max(best,cur)','把 cur 和 best 初始化为首元素，对空数组也直接读取首元素','总是强制选择一个元素，哪怕所有元素都为负','先按值排序后选择正数相加'],a:[0],x:'以当前位置结尾且允许放弃此前区间时，负的累计和只会拖累后续，故将 cur 截断为0；best 跟踪最大值。空数组不进入循环返回0，全负数组也可选空区间返回0，总时间 O(n)、额外空间 O(1)。'},
{id:'B01',area:'bankbiz',topic:'支付清算概念',level:'基础',q:'模拟题：团队讨论跨机构支付链路，哪种说法最能区分清算与结算的抽象含义？',o:['清算核对并确定各方应收应付，结算完成相应资金或账务义务的最终履行','清算等同于用户打开支付页面，结算等同于输入密码','清算只负责页面展示，结算只负责日志压缩','清算与结算都只表示发送通知，不涉及债权债务'],a:[0],x:'A区分了义务的确定与履行。B把用户操作混为后台过程，C将界面和日志当作核心定义，D忽略应收应付及其履行，均不符合抽象概念。'},
{id:'B02',area:'bankbiz',topic:'支付状态',level:'基础',q:'模拟题：手机银行支付请求返回“处理中”，但尚未获得最终账务结果。产品页面最适合怎样展示？',o:['明确展示处理中并提供后续查询入口，避免直接宣称成功或失败','立即显示成功，不再查最终结果','立即显示失败并建议用户重复提交相同请求','隐藏订单，待用户联系客服时再临时查找'],a:[0],x:'A如实表达未决状态并支持查询。B和C都把未知当作确定结论，可能误导重复交易；D牺牲可追踪性，无法帮助用户核实。'},
{id:'B03',area:'bankbiz',topic:'清算差异核查',level:'进阶',q:'模拟题：内部交易记录与外部对账文件出现一笔状态不一致，技术与运营应先做什么？',o:['保留原始记录，按交易标识和状态流转核查差异并进入异常处理','直接改写内部余额使汇总数相等','删除外部差异记录以保持报表整齐','凭页面提示推断结果并跳过账务核对'],a:[0],x:'A先保留证据、定位差异再按核实结果处理。B未经核实改余额，C抹去差异，D以页面代替账务事实，都会破坏可追溯性。'},
{id:'B04',area:'bankbiz',topic:'支付链路协同',level:'进阶',q:'模拟题（多选）：模拟支付链路中，上游超时后可能重发同一业务请求。哪些措施有助于安全协同处理？',o:['用稳定的业务请求标识识别重试','把受理状态与最终账务结果分开记录','提供基于交易标识的结果查询和对账能力','每次重试都生成一笔新扣款以保证请求被处理'],a:[0,1,2],x:'A识别同一业务意图，B避免把受理误作完成，C便于查清最终结果；D会把重试变成重复扣款，故不选。'},
{id:'B05',area:'bankbiz',topic:'幂等设计',level:'基础',q:'模拟题：柜面终端因网络重试，向服务端两次发送同一笔转账的相同业务请求标识。理想处理是？',o:['同一标识只产生一次业务生效结果，后续请求返回可核实的既有结果','两次请求各自扣款，事后靠用户发现','只根据请求到达时间判断是否应扣款','丢弃所有带有业务请求标识的请求'],a:[0],x:'A保证同一业务意图不会因重试重复生效。B造成重复账务，C时间不能可靠标识业务，D则使正常请求无法办理。'},
{id:'B06',area:'bankbiz',topic:'反欺诈与误报',level:'进阶',q:'模拟题：反欺诈规则拦截了一笔经进一步核实后确认为正常的模拟交易。团队应如何兼顾风险与体验？',o:['按受控流程复核放行，并把误报原因反馈用于评估规则','永久关闭所有风险规则以杜绝误报','忽略复核结论，让所有被拦交易永不处理','把交易人的完整资料公开给所有开发人员讨论'],a:[0],x:'A允许受控纠错并持续评估规则。B失去风控能力，C无视误报伤害正常业务，D违反最小化使用敏感资料的原则。'},
{id:'B07',area:'bankbiz',topic:'账户安全',level:'基础',q:'模拟题：用户在手机银行修改高风险账户设置，后端如何处理更稳妥？',o:['通过既定身份核验与授权流程验证操作，再留存必要审计记录','仅因设备曾登录就跳过所有核验','让客服在聊天窗口索取完整登录密码','把修改权限开放给任意已登录员工'],a:[0],x:'A兼顾身份确认、授权和可追溯性。B把历史登录等同于本次授权，C不应收集密码，D违反最小权限。'},
{id:'B08',area:'bankbiz',topic:'风控处置',level:'进阶',q:'模拟题（多选）：某反欺诈模型对正常业务误报增多。哪些做法合理？',o:['抽样复核并记录误报类型与影响','在授权范围内用去标识化样本分析规则','保留必要的人工作业与申诉纠错路径','为追求零误报直接让所有高风险交易免检'],a:[0,1,2],x:'A提供误报证据，B降低分析中的隐私暴露，C让正常用户有受控纠错路径；D完全取消检查会放大真实欺诈风险。'},
{id:'B09',area:'bankbiz',topic:'双录流程',level:'基础',q:'模拟题：某业务流程要求在办理时完成音视频记录，系统发现录制画面中断。应如何设计流程状态？',o:['标记记录未完整，按适用业务流程重新完成所需录制；必要时转人工核查后续处置','将中断的录制自动标记完整','只保留一张成功页面截图充当全程记录','让柜员事后自行口头确认录制成功即可'],a:[0],x:'A保留录制不完整状态，并依适用流程补齐所需录制；人工核查不能自动代替必需的过程记录。B、C、D均不能证明该流程所需记录完整；本题不预设具体监管规则。'},
{id:'B10',area:'bankbiz',topic:'双录资料关联',level:'进阶',q:'模拟题：柜面已形成一段模拟双录文件，但上传回执暂未返回。哪项设计有利于后续核查？',o:['保存业务流水与录制任务的关联及上传状态，待回执确认后再标记归档完成','只保存“录制成功”文字，不关联业务','拿另一笔业务的录制文件填补当前空位','删除上传失败日志以减少告警'],a:[0],x:'A可追踪关联与未决状态。B不能定位证据，C张冠李戴，D消灭排障依据；回执未确认时不应假定归档完成。'},
{id:'B11',area:'bankbiz',topic:'客户资料更正',level:'基础',q:'模拟题：经办人员发现模拟客户资料中的联系字段需要更正，系统应优先支持什么？',o:['经授权的更正流程、必要的变更痕迹和影响范围核对','任何员工均可无痕覆盖原值','在公共群聊粘贴整份资料征求意见','为省事直接删除该客户的全部历史交易'],a:[0],x:'A兼顾授权、可追溯及下游一致性。B无法审计，C扩大资料暴露，D与字段更正无关且损坏历史记录。'},
{id:'B12',area:'bankbiz',topic:'客户资料最小化',level:'进阶',q:'模拟题（多选）：测试柜面资料录入与手机银行展示的衔接，哪些做法适当？',o:['优先使用虚构的模拟客户数据','仅向测试角色开放所需字段','验证更正后两个渠道展示状态是否一致','把真实客户完整资料复制到个人云盘方便对照'],a:[0,1,2],x:'A避免真实信息进入测试，B贯彻最小权限，C验证跨渠道同步；D把真实资料放到个人云盘会造成不必要的隐私风险。'},
{id:'B13',area:'bankbiz',topic:'柜面流程',level:'基础',q:'模拟题：柜员提交某产品办理请求后，后台返回“待补齐材料”，界面应如何引导？',o:['显示待补材料及当前状态，引导按既定流程补齐后继续办理','强制展示办理成功并关闭任务','默认把尚未提供的材料标记为已收到','绕开材料检查直接生成最终业务结果'],a:[0],x:'A与实际状态一致，支持从待补材料继续流转。B和D虚报或跳过流程，C凭空记录材料，不利于核查。'},
{id:'B14',area:'bankbiz',topic:'手机银行流程',level:'基础',q:'模拟题：用户点击提交后页面超时，但后台处理结果未知。产品交互哪种更合理？',o:['提示结果待确认并提供原请求的进度查询，避免诱导新建重复请求','连续自动生成新业务请求直到页面变绿','立即展示“办理失败”且清除原请求号','禁止用户查看历史办理记录'],a:[0],x:'A保留请求关联并处理未决状态。B可能重复办理，C未经确认就判失败且失去追踪线索，D阻断核实。'},
{id:'B15',area:'bankbiz',topic:'跨渠道办理',level:'进阶',q:'模拟题：一笔产品申请在手机银行发起、柜面补交材料。如何减少跨渠道状态冲突？',o:['共用可追踪的申请标识与状态规则，按授权流程处理并发变更','两个渠道各建互不关联的申请并分别生效','由最后打开页面的一方无条件覆盖另一方状态','只同步页面颜色，不同步业务状态'],a:[0],x:'A使跨渠道对同一申请和状态含义达成一致。B制造重复申请，C可能覆盖有效处理，D只改外观不能解决业务冲突。'},
{id:'B16',area:'bankbiz',topic:'产品上线协同',level:'进阶',q:'模拟题（多选）：柜面与手机银行共享一项新办理流程。上线前哪些协同检查有价值？',o:['核对两渠道状态与错误提示含义','用虚构案例验证异常回退和重复提交','确认运营支持人员可查询必要的办理进度','把校验逻辑全部关闭以减少测试步骤'],a:[0,1,2],x:'A防止跨渠道语义冲突，B覆盖失败路径，C便于后续服务；D关闭校验会掩盖问题，不是合格上线检查。'},
{id:'B17',area:'bankbiz',topic:'对账差异',level:'基础',q:'模拟题：模拟对账清单中，内部记录有一笔“处理中”，外部记录暂未出现；正确的初步判断是？',o:['这是待核实差异，应结合状态与后续结果追踪，不能仅凭缺席判失败','外部清单未出现即证明内部账务可以随意冲销','该笔一定已经最终成功，无需跟进','复制另一笔交易补进外部清单即可'],a:[0],x:'A承认未决并继续核实。B与C把信息不足当成确定结果，D伪造对应关系，均不安全。'},
{id:'B18',area:'bankbiz',topic:'账务一致性',level:'进阶',q:'模拟题：转账业务在扣减来源账户后、增加目标账户前发生故障。哪项要求最能维护账务一致性？',o:['让相关账务变化按一致的事务或补偿规则完成，失败时可核查并纠正','来源扣减成功就永远视为业务完成','把目标账户变化仅写在页面缓存里','通过删除异常日志消除不平衡记录'],a:[0],x:'A要求对关联账务进行一致性控制并可恢复。B留下单边变更，C没有真实入账，D只隐藏差错，均不能维护账务一致性。'},
{id:'B19',area:'bankbiz',topic:'事件与幂等',level:'进阶',q:'模拟题：账务提交后，消息系统可能重复投递“业务已完成”事件。下游积分展示模块应如何处理？',o:['按事件或业务唯一标识做幂等处理，重复投递不重复增加积分','每收到一条消息就再次增加积分','假定消息系统绝不会重复投递','靠人工每天删除一半积分记录抵消重复'],a:[0],x:'A把重复消息与同一业务结果对应，避免重复计入。B会多计，C依赖不成立的假设，D无法准确识别重复且会误删正常记录。'},
{id:'B20',area:'bankbiz',topic:'对账闭环',level:'进阶',q:'模拟题（多选）：日终模拟对账发现交易金额与状态有差异。哪些步骤构成更可靠的处理闭环？',o:['按业务标识定位两侧记录并分类差异','保留核查与调整的审批和操作痕迹','核实账务结果后按受控流程处理并复核','为让报表相等直接批量覆盖来源数据'],a:[0,1,2],x:'A定位根因，B提供追溯依据，C使调整以事实和复核为前提；D直接覆盖会掩盖差错，故排除。'},
{id:'B21',area:'bankbiz',topic:'可用性与容灾',level:'基础',q:'模拟题：主服务不可用时，团队评估将业务切至备服务。哪项准备最关键？',o:['事先验证切换路径、数据同步状态及切回方案','只保证备用机外观与主机相同','故障时先把全部权限设为公开','不做演练，默认备服务必然可用'],a:[0],x:'A覆盖服务恢复与数据正确性。B与可用性无关，C制造安全风险，D无法发现切换与同步缺陷。'},
{id:'B22',area:'bankbiz',topic:'降级策略',level:'进阶',q:'模拟题：推荐模块故障拖慢手机银行首页，但登录与账户查询仍正常。合理的降级方案是？',o:['隔离或暂隐推荐模块，保留经核验可用的核心功能并监测恢复','为保推荐内容而停掉所有账户查询','绕过登录鉴权以提高首页速度','把异常直接显示成账户余额变化'],a:[0],x:'A将非核心故障与核心服务隔离。B扩大故障面，C牺牲账户安全，D误报账务信息，均不合理。'},
{id:'B23',area:'bankbiz',topic:'权限控制',level:'基础',q:'模拟题：运营同事只需要查询产品办理状态，不需要导出客户完整资料。怎样授权较合适？',o:['授予必要的状态查询权限，不开放无关的完整资料导出','授予所有生产库写入权限以便灵活处理','共用管理员账号避免重复申请','把完整资料公开链接发给整个团队'],a:[0],x:'A遵循按工作需要授权。B权限过宽，C无法区分责任，D扩大敏感资料暴露范围。'},
{id:'B24',area:'bankbiz',topic:'容灾演练',level:'进阶',q:'模拟题（多选）：在隔离的模拟环境做业务容灾演练，哪些检查是必要的？',o:['验证关键流程能否在备环境继续运行','核对切换前后模拟账务与交易状态','记录故障发现、切换与恢复中的问题','只检查演练汇报页面颜色，不核验业务数据'],a:[0,1,2],x:'A验证服务可用，B验证状态和账务正确，C为改进留下依据；D只看外观不能说明业务连续性。'},
{id:'B25',area:'bankbiz',topic:'日志隐私',level:'基础',q:'模拟题：排查账户登录失败时需要日志定位错误。日志方案哪项更妥当？',o:['记录必要的错误码与关联标识，对敏感字段脱敏并控制访问','把密码和完整身份信息写入可公开检索的日志','为方便查错永久公开原始请求报文','不留任何事件标识，完全依赖用户口述'],a:[0],x:'A兼顾排障、最小化与访问控制。B和C暴露敏感信息，D使故障难以关联定位。'},
{id:'B26',area:'bankbiz',topic:'测试数据',level:'基础',q:'模拟题：研发需要验证客户资料搜索功能，测试集应优先采用什么？',o:['按预期格式构造虚构姓名与虚构标识等模拟数据','从生产环境复制真实客户全量档案到个人电脑','在工单中张贴真实证件影像供所有人查看','向同事索要其个人账户资料充当测试样本'],a:[0],x:'A可覆盖格式和流程而不使用实际客户资料。B、C泄露真实资料，D不应收集同事个人账户信息作为测试输入。'},
{id:'B27',area:'bankbiz',topic:'敏感信息事件',level:'进阶',q:'模拟题：发现一份含敏感字段的模拟导出文件被错误设置为团队公开。应先怎样处置？',o:['及时收紧访问并保留必要证据，按既定事件流程评估影响与跟进','继续公开以方便确认访问人数','静默删除全部访问日志并不再报告','把文件复制到更多共享位置让大家协助寻找'],a:[0],x:'A先控制暴露并保留可核查线索。B和D扩大传播，C抹除追溯依据且妨碍后续处置；情境仅使用虚构数据。'},
{id:'B28',area:'bankbiz',topic:'隐私与权限协作',level:'进阶',q:'模拟题（多选）：分析手机银行办理失败原因时，哪些做法符合最小化思路？',o:['优先汇总错误码与流程节点而非展示完整身份字段','按职责限制原始记录的访问范围','对用于测试复现的样本使用虚构信息','把所有原始交易明细发到无权限限制的群聊'],a:[0,1,2],x:'A减少不必要字段，B限定可见人员，C避免真实资料进入测试；D无差别传播原始明细，故不选。'},
{id:'B29',area:'bankbiz',topic:'业务连续性',level:'基础',q:'模拟题：手机银行部分功能暂停，但柜面渠道仍可办理同类模拟业务。对外说明应如何处理？',o:['准确说明受影响功能与已核实的可用渠道，并保持状态更新','保证所有功能已恢复，即使团队尚未核实','让用户反复提交失败请求碰碰运气','隐瞒柜面是否可用且不提供任何核实途径'],a:[0],x:'A以已核实的信息帮助用户继续办理。B编造恢复状态，C增加重复请求风险，D没有提供连续服务所需的信息。'},
{id:'B30',area:'bankbiz',topic:'故障沟通',level:'进阶',q:'模拟题：支付处理服务发生故障，技术团队尚在排查最终账务结果。客服与技术的最佳协作是？',o:['共享统一的未决状态与查询路径，对用户避免承诺未经核实的结果','客服一律答复交易已成功以稳定情绪','技术只报服务器已重启，不同步业务影响','把所有未决交易都当作失败引导重新支付'],a:[0],x:'A保证跨团队口径与事实一致。B和D擅自判定结果，C仅报技术动作而忽略业务状态，均可能误导用户。'},
{id:'B31',area:'bankbiz',topic:'业务监控',level:'基础',q:'模拟题：系统接口响应恢复正常，但用户仍报告办理申请停留在“处理中”。此时最值得补看的指标是？',o:['申请在各业务状态的积压量与最终完成率','首页背景图的文件大小','团队工位数量','开发分支名称长度'],a:[0],x:'A可以检验技术恢复后业务是否真正完成。B、C、D与办理状态积压没有直接关联，无法说明业务恢复。'},
{id:'B32',area:'bankbiz',topic:'连续性协同',level:'进阶',q:'模拟题（多选）：设计一份模拟业务连续性预案，哪些内容有实际价值？',o:['识别必须优先维持的业务流程及依赖','约定跨运营、客服和技术的沟通责任','明确恢复后对未决交易的核查与复盘','只记录服务器名称而不考虑业务状态'],a:[0,1,2],x:'A确定业务优先级，B降低协同混乱，C避免服务恢复后遗留未决交易；D缺少业务视角，不能单独构成有效预案。'},
{id:'B33',area:'bankbiz',topic:'金融常识',level:'基础',q:'模拟题：团队讨论银行经营中的“流动性”概念，以下哪项理解更贴切？',o:['在需要履行到期支付义务时，具备可动用资金的能力','任何长期资产的账面价值都等同于随时可用现金','只要系统页面响应快就说明资金流动性充足','客户数量增长必然消除所有资金错配'],a:[0],x:'A强调到期支付时资金可获得性。B把资产价值混为现金，C把技术性能混为财务能力，D把客户数误作流动性保证。此题仅为概念辨析，不构成投资建议。'},
{id:'B34',area:'bankbiz',topic:'银行资产负债',level:'基础',q:'模拟题：从银行自身资产负债视角看，客户存款和银行发放的贷款一般分别如何理解？',o:['客户存款通常体现银行的负债，发放贷款通常体现银行的资产','客户存款和贷款都只体现银行的费用','客户存款通常体现银行的资产，发放贷款通常体现银行的负债','两者都只是页面字段，不涉及资产负债'],a:[0],x:'A符合银行需偿还存款、可收回贷款的基本视角。B把余额概念误作费用，C把方向颠倒，D否认账务含义；这是基础分类而非产品建议。'},
{id:'B35',area:'bankbiz',topic:'产品信息呈现',level:'基础',q:'模拟题：设计存款产品介绍页时，团队面对收益与条件说明，应如何呈现才不误导？',o:['区分产品条件、适用范围与示例计算，明确示例不是实际结果承诺','只展示最吸引人的模拟收益，隐藏计算前提','把任意模拟数字写成对所有客户的保证收益','省略条件并要求用户自行猜测'],a:[0],x:'A让示例与条件边界清晰。B隐藏前提，C将虚构示例当保证，D使用户无法理解条件，均会误导；不提供任何投资决策建议。'},
{id:'B36',area:'bankbiz',topic:'金融常识协同',level:'基础',q:'模拟题（多选）：为非金融背景研发同事解释银行产品页面，哪些表述有助于避免误解？',o:['区分银行资产负债视角与客户个人视角','说明示例数据只是虚构演示，不代表实际产品承诺','展示余额前先明确所指账户和状态口径','将任何演示收益都描述为对所有用户的确定结果'],a:[0,1,2],x:'A避免视角颠倒，B划清演示与承诺边界，C减少余额口径歧义；D把演示误称为确定收益，故排除。'},
{id:'B37',area:'bankbiz',topic:'异常退款协同',level:'进阶',q:'模拟题：某模拟订单页面显示“退款发起”，但账务系统尚无最终退款完成记录。如何回答用户查询？',o:['区分已受理与最终完成，提供同一订单的后续状态核实路径','将“发起”直接解释为资金已退回','让用户重建订单以刷新退款状态','删除退款申请后告知用户已处理完毕'],a:[0],x:'A保持产品状态与账务结果一致。B把过程当结果，C与核实退款无关且可能引入新业务，D会破坏可追踪性。'},
{id:'B38',area:'bankbiz',topic:'支付与账务协同',level:'进阶',q:'模拟题：渠道侧收到“超时”，账务侧显示该请求仍在处理，另一条相同请求标识的重试到达。应如何设计协同判断？',o:['先按请求标识关联既有处理状态，避免重复生效，并持续查询最终账务结果','把渠道超时等同于账务失败，立即另扣一次','无视请求标识，仅依据用户是否刷新页面决定入账','为了消除未知状态直接手工把两次请求都记为成功'],a:[0],x:'A同时处理未决状态与幂等重试。B将超时误判失败且可能重复扣款，C缺乏业务关联，D未经核实便确认两笔结果。'},
{id:'B39',area:'bankbiz',topic:'跨团队数据共享',level:'基础',q:'模拟题：产品团队要分析模拟客户在柜面与手机银行的办理路径，研发提供数据时应优先怎么做？',o:['只提供完成分析所需的去标识化路径与状态，并限定访问范围','连同完整身份字段与联系方式无条件共享','将原始办理记录发布为可公开下载链接','直接使用实际客户资料替代虚构样本且不做授权核查'],a:[0],x:'A保留分析能力并控制数据范围。B和C扩大敏感信息暴露，D引入未经必要核查的真实资料，不符合最小化思路。'},
{id:'B40',area:'bankbiz',topic:'端到端协同复盘',level:'进阶',q:'模拟题（多选）：一个虚构的手机银行支付故障已修复接口错误。复盘时还应检查哪些事项？',o:['核查受影响请求的最终账务状态与对账结果','评估未决状态提示、客服口径和用户查询入口','检验修复后的重试幂等与监控告警','只看接口恢复截图，不核查交易结果'],a:[0,1,2],x:'A确认资金与记录一致，B修正跨团队服务体验，C防止重复生效和再次漏报；D忽略业务结果，不能证明故障闭环。'}
];

function renderMock(){if(ui.mock){let m=ui.mock,s=m.sections[m.section],ids=s.ids,idx=m.index,q=bank.find(x=>x.id===ids[idx]);return header('限时模考','分科独立计时，到时自动跳科。四模块独立计时；题量、时长均为本站自定，不对应任何银行正式考试。',`<button class="btn" data-abort>退出模考</button>`)+`<div class="mock-topline"><div class="mock-section">${m.sections.map((x,i)=>`<span class="pill" style="${i===m.section?'background:#dcecfb;border-color:#9cc3e6':''}">${i+1}. ${META[x.area].name} · ${x.ids.length}题</span>`).join('')}</div><div class="timer" id="mockClock">${formatTime(m.remain)}</div></div><div class="practice-layout"><div id="questionPanel">${questionHTML(q,idx,ids.length,true)}</div><div class="card navigator"><div class="label">${META[s.area].name} · 本节答题卡</div><div class="navgrid">${ids.map((id,i)=>`<button data-mjump="${i}" class="${i===idx?'current':''} ${m.answers[id]?.length?'done':''}">${i+1}</button>`).join('')}</div><div class="key">本节结束后不能返回。请在倒计时结束前检查未答题。</div><div class="minirow"><span>已答题数</span><b>${ids.filter(id=>m.answers[id]?.length).length}/${ids.length}</b></div><button class="btn primary" data-endsection style="margin-top:15px;width:100%">${m.section===m.sections.length-1?'交卷并查看成绩':'结束本节，进入下一科'}</button></div></div>${footer()}`}
if(ui.mockResult){const r=ui.mockResult;return header('本次模考完成','通用练习卷只用于自测，答题反馈与解析可在下方逐题查看。',`<button class="btn primary" data-startmock>再做一套 →</button>`)+`<div class="two-col"><div class="card"><div class="eyebrow">SIMULATION RESULT</div><div class="result-total">${r.score}<span> / ${r.total} 道正确</span></div><p>答题 ${r.answered} 道 · 正确率 ${Math.round(r.score/r.total*100)}% · ${new Date(r.date).toLocaleString('zh-CN')}</p><div class="progress"><i style="width:${r.score/r.total*100}%"></i></div></div><div class="card"><h3>分科表现</h3>${MOCK_SPEC.map(s=>{let rows=r.rows.filter(v=>v.area===s.area);return `<div class="minirow"><span>${META[s.area].name}</span><b>${rows.filter(v=>v.correct).length}/${rows.length}</b></div>`}).join('')}</div></div><div class="sectionhead"><h2>逐题复盘</h2><small>点击题目展开答案和解析</small></div><div class="result-list">${r.rows.map((v,i)=>{let q=bank.find(item=>item.id===v.id);return `<details class="card" style="padding:14px 18px"><summary style="cursor:pointer;line-height:1.7"><b style="color:${v.correct?'var(--good)':'var(--bad)'}">${v.correct?'正确':'错误'}</b>　${i+1}. ${esc(q.q)}</summary><div style="padding:12px 0 0;line-height:1.8;color:var(--muted)">你的答案：${v.selected.length?v.selected.map(n=>String.fromCharCode(65+n)).join('、'):'未答'}　|　正确答案：${q.a.map(n=>String.fromCharCode(65+n)).join('、')}<br>${esc(q.x)}<br><button class="btn sm" data-star="${q.id}" style="margin-top:9px">${data.favorites[q.id]?'★ 已收藏':'☆ 收藏本题'}</button></div></details>`}).join('')}</div>${footer()}`}
return header('限时模考','本站自定的四模块限时练习卷，不对应任何一家银行的真实考试结构、题量或计时规则。')+`<div class="mock-intro"><div class="card"><div class="eyebrow">FOCUSED SIMULATION</div><h3 style="font-size:23px;margin-top:3px">一套卷，快速发现薄弱项。</h3><p>职业能力、英语、计算机基础、银行业务场景依次练习，模块独立倒计时；可提前跳到下一模块，不能回退。交卷后统一查看解析。</p><div class="mock-spec"><div><b>44</b><span>原创选择题</span></div><div><b>60′</b><span>总时长上限</span></div><div><b>4</b><span>独立练习模块</span></div></div><div class="callout">题量 12＋8＋16＋8，时长 18＋10＋22＋10 分钟，仅为本站自定训练节奏。各行各岗考试科目与时间可能不同，请以目标银行通知为准。</div><button class="btn primary" data-startmock style="margin-top:22px">开始本套模考 →</button></div><div class="card"><h3>考试结构</h3>${MOCK_SPEC.map((s,i)=>`<div class="step" style="margin:12px 0"><span class="stepnum">${i+1}</span><div><strong>${META[s.area].name}</strong><small>${s.count}道 · ${s.secs/60}分钟</small></div></div>`).join('')}<p style="font-size:12px">编程思维适合研发岗位加练，不计入这套通用练习卷；部分岗位也不考英语或银行业务，以通知为准。</p><h3 style="margin-top:20px">最近成绩</h3>${data.mockHistory.length?data.mockHistory.slice(0,3).map(x=>`<div class="minirow"><span>${new Date(x.date).toLocaleDateString('zh-CN')}</span><b>${x.score}/${x.total}</b></div>`).join(''):'<p style="font-size:12px">完成第一套后会显示在这里。</p>'}</div></div>${footer()}`}
function renderSources(){return header('资料来源与边界','招聘公告用于核对岗位与招聘流程；往届考生记录仅用于识别题型方向。新增跨银行场景题是原创练习，不是各行真题。')+`<div class="two-col"><div><div class="card"><h3>从考点到模拟题，如何处理</h3><p>早期收集的笔经以中国银行科技岗位考生记录为主，仅提供零散题意与方向；扩题时另加入跨银行适用的计算机基础、英语、职业能力和银行业务场景。招聘公告不提供本站题目，也不能证明所有银行采用相同试卷。</p><div class="hint"><strong>三个不要混淆</strong><br>① 招聘公告 ≠ 考试真题；② 各家银行科目、题量和编程环节可能不同；③ 考生回忆 ≠ 官方标准答案。</div></div><div class="sectionhead"><h2>公开来源</h2><small>点击可打开对应网页 · 需要联网</small></div><div class="sources">${SOURCES.map(s=>`<div class="source"><strong>${esc(s.name)}</strong><small>${esc(s.type)}</small><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">查看原始资料 ↗</a></div>`).join('')}</div></div><div><div class="card"><h3>适用范围</h3><div class="minirow"><span>通用训练</span><b>职业能力 / 英语 / 计算机</b></div><div class="minirow"><span>按岗加练</span><b>编程 / 银行业务场景</b></div><div class="minirow"><span>本地题库</span><b>${bank.length} 道原创题</b></div><p style="font-size:12px">真实考试可能另含综合知识、金融常识、编程或心理测评，也可能不考其中某项；请以所报银行和岗位的通知为准。</p></div><div class="card" style="margin-top:16px"><h3>隐私与保存</h3><p style="font-size:12px">本站无账号、无服务端、无外部脚本。答案、收藏、成绩仅保存在浏览器本地存储。换浏览器或清除网站数据可能丢失记录。</p><button class="btn sm" data-reset>清空本机刷题记录</button></div></div></div>${footer()}`}
function footer(){return '<div class="footer-note">银行科技岗 · 通用刷题　/　非任何银行官方产品　/　原创模拟题　/　整理：2026-10-14</div>'}
function notice(text){let n=document.createElement('div');n.textContent=text;n.style='position:fixed;bottom:24px;right:24px;background:#142d49;color:white;padding:12px 16px;border-radius:9px;z-index:20;box-shadow:0 8px 25px #163a6240';document.body.appendChild(n);setTimeout(()=>n.remove(),3000)}
function go(page){if(ui.mock&&page!=='mock'){if(!confirm('离开模考将放弃本次尚未交卷的答案，确定退出吗？'))return;clearInterval(mockInterval);ui.mock=null}ui.page=page;ui.filter='all';ui.search='';ui.index=0;ui.showAnswerId=null;render();window.scrollTo(0,0)}
function choice(id,i){let q=bank.find(v=>v.id===id);if(ui.mock){let arr=ui.mock.answers[id]||[];ui.mock.answers[id]=q.a.length===1?[i]:arr.includes(i)?arr.filter(x=>x!==i):[...arr,i];render();return}if(answered(q))return;let arr=ui.draft?.id===id?ui.draft.values:[];ui.draft={id,values:q.a.length===1?[i]:arr.includes(i)?arr.filter(x=>x!==i):[...arr,i]};updateQuestion()}
function updateQuestion(){let list=currentList(),q=list[ui.index];if(!q)return;const panel=$('#questionPanel');let chosen=ui.draft?.id===q.id?ui.draft.values:[];panel.querySelectorAll('.option').forEach((el,i)=>el.classList.toggle('selected',chosen.includes(i)));let submit=panel.querySelector('[data-submit]');if(submit)submit.disabled=!chosen.length}
function submit(id){let selected=ui.draft?.id===id?ui.draft.values:[];if(!selected.length)return;data.answers[id]=selected.slice().sort((a,b)=>a-b);ui.draft=null;persist();render()}
function retry(id){delete data.answers[id];persist();ui.draft=null;render()}
function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelectorAll('[data-area]').forEach(e=>e.onclick=()=>{go('practice');ui.filter=e.dataset.area;ui.index=0;render()});document.querySelectorAll('[data-filter]').forEach(e=>e.onclick=()=>{ui.filter=e.dataset.filter;ui.index=0;ui.draft=null;render()});let search=$('#search');if(search){search.oninput=()=>{let focus=search.selectionStart;ui.search=search.value;ui.index=0;ui.draft=null;render();let next=$('#search');next.focus();next.setSelectionRange(focus,focus)}}document.querySelectorAll('[data-jump]').forEach(e=>e.onclick=()=>{ui.index=+e.dataset.jump;ui.draft=null;render()});document.querySelectorAll('[data-mjump]').forEach(e=>e.onclick=()=>{ui.mock.index=+e.dataset.mjump;render()});document.querySelectorAll('[data-prev]').forEach(e=>e.onclick=()=>{ui.mock?ui.mock.index--:ui.index--;ui.draft=null;render()});document.querySelectorAll('[data-next]').forEach(e=>e.onclick=()=>{if(ui.mock){if(ui.mock.index===ui.mock.sections[ui.mock.section].ids.length-1)nextSection();else{ui.mock.index++;render()}}else{ui.index++;ui.draft=null;render()}});document.querySelectorAll('.option:not(:disabled)').forEach(e=>e.onclick=()=>choice(e.closest('[data-q]').dataset.q,+e.dataset.opt));document.querySelectorAll('[data-submit]').forEach(e=>e.onclick=()=>submit(e.dataset.submit));document.querySelectorAll('[data-star]').forEach(e=>e.onclick=()=>{let id=e.dataset.star;data.favorites[id]=!data.favorites[id];persist();render()});document.querySelectorAll('[data-reveal]').forEach(e=>e.onclick=()=>{ui.showAnswerId=ui.showAnswerId===e.dataset.reveal?null:e.dataset.reveal;render()});document.querySelectorAll('[data-firstunanswered]').forEach(e=>e.onclick=()=>{let next=currentList().findIndex(q=>!answered(q));if(next<0)notice('当前筛选条件下的题目已全部做过');else{ui.index=next;ui.showAnswerId=null;ui.draft=null;render()}});document.querySelectorAll('[data-retry]').forEach(e=>e.onclick=()=>retry(e.dataset.retry));document.querySelectorAll('[data-startmock]').forEach(e=>e.onclick=startMock);document.querySelectorAll('[data-endsection]').forEach(e=>e.onclick=()=>nextSection());document.querySelectorAll('[data-abort]').forEach(e=>e.onclick=()=>go('home'));document.querySelectorAll('[data-reset]').forEach(e=>e.onclick=()=>{if(!confirm('将清空本浏览器中的所有答案、收藏和模考成绩；此操作不可恢复。确认吗？'))return;data.answers={};data.favorites={};data.mockHistory=[];persist();render();notice('本机刷题记录已清空')})}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
render();
</script></body></html>
